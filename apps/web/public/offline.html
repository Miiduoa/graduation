<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#234c39" />
    <title>離線 · Campus One</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f8f7f3;
        color: #243b35;
        font-family: system-ui, sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 440px;
      }
      .brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 30px;
        font-weight: 600;
        margin-top: 40px;
      }
      p {
        color: #626e67;
      }
      button {
        margin-top: 20px;
        padding: 12px 24px;
        border: 0;
        border-radius: 4px;
        background: #28483b;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #bd581f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">CAMPUS ONE</div>
      <h1>目前沒有網路連線。</h1>
      <p>
        請確認 Wi-Fi 或行動網路，再重新載入頁面。若剛才正在繳交作業，請在恢復連線後確認繳交紀錄。
      </p>
      <button type="button" onclick="window.location.reload()">重新載入</button>
    </main>
  </body>
</html>
