# 11_navigation_ai_first.yaml
# 4+1 AI-First：底部四 Tab、頭像抽屜、中央 AI 球
# 需在已通過 Onboarding 的情境下執行（或接在 01 之後）。

appId: ${APP_ID}
name: Navigation AI-First Shell
tags:
  - smoke
  - navigation
  - ai

---

- launchApp

- tapOn:
    text: 'Reload'
    optional: true

# 主儀表／今天 Tab（以 testID 斷言，避免字型過小導致無障礙樹不含字面）
- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000


# 底部情境 Tab（FloatingTabBar testID tab-<路由名>）
- assertVisible:
    id: 'tab-Today'
- assertVisible:
    id: 'tab-學習'
- assertVisible:
    id: 'tab-校園'
- assertVisible:
    id: 'tab-訊息'

- takeScreenshot: ai_first_tabs

# Maestro id 對應 RN testID
- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 5000


- takeScreenshot: header_drawer_open

# 關閉抽屜（點遮罩）
- tapOn:
    text: '關閉抽屜'
    optional: true

- tapOn:
    id: 'ai-floating-ball'
    optional: true

- extendedWaitUntil:
    visible: 'AI 校園助理'
    timeout: 8000
    optional: true

- takeScreenshot: ai_overlay_optional

