name: Credit Scenario Adoption Checks

on:
  pull_request:
    paths:
      - 'packages/shared/src/credit*'
      - 'packages/shared/tests/credit*'
      - 'apps/web/src/components/academic/**'
      - 'apps/web/src/lib/credit*'
      - 'apps/mobile/src/screens/CreditPlanningScreen.tsx'
      - 'apps/mobile/src/screens/creditAudit/**'
      - 'apps/mobile/src/features/academics/**'
      - 'apps/mobile/src/__tests__/Credit*'
      - 'scripts/qa/credit-scenario-adoption*'
      - '.github/workflows/credit-scenario-adoption.yml'

permissions:
  contents: read

concurrency:
  group: credit-scenario-adoption-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preserve reproducible source snapshot
        run: |
          mkdir -p artifacts/credit-scenario-adoption
          git ls-files -z packages/shared/src packages/shared/tests apps/web/src/components/academic 'apps/web/src/lib/credit*' apps/mobile/src/screens/CreditPlanningScreen.tsx apps/mobile/src/screens/creditAudit apps/mobile/src/features/academics 'apps/mobile/src/__tests__/Credit*' scripts/qa .github/workflows > /tmp/credit-source-files
          tar --null -T /tmp/credit-source-files -czf artifacts/credit-scenario-adoption/source.tgz
          printf '%s\n' "$SOURCE_HEAD_SHA" > artifacts/credit-scenario-adoption/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: credit-scenario-source
          path: artifacts/credit-scenario-adoption/source*
          retention-days: 7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shared adoption contracts
        run: |
          pnpm --filter @campus/shared exec tsc src/creditScenarioAdoption.ts --strict --target ES2022 --module commonjs --skipLibCheck --outDir ../../.credit-adoption-build
          node --test packages/shared/tests/creditScenarioAdoption.test.cjs | tee artifacts/credit-scenario-adoption/core-results.tap
      - name: Web scenario regression
        run: pnpm --filter web exec vitest run src/components/academic/CreditPlanScenarios.test.tsx src/components/academic/CreditScenarioAdoption.test.tsx src/components/academic/CreditPlannerWorkspace.test.tsx src/lib/creditScenarioWrite.test.ts --reporter=default --reporter=json --outputFile=../../artifacts/credit-scenario-adoption/web-results.json
      - name: Native scenario regression
        run: pnpm --filter mobile exec jest --runInBand --watch=false --testPathPatterns='Credit(ScenarioAdoptionScreen|PlanScenarioCard|PlanningScreen|PlanningDraftProtection|PlanBatchSaveScreen|TranscriptPlanWrite)' --json --outputFile=../../artifacts/credit-scenario-adoption/native-results.json
      - name: Prepare Chinese browser fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise adoption and undo in real Chrome
        run: node scripts/qa/credit-scenario-adoption-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credit-scenario-adoption-results
          path: artifacts/credit-scenario-adoption
          retention-days: 14
