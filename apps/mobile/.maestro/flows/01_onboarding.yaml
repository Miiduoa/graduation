appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# Guest access must not depend on a Google or university login.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertVisible:
    id: public-Map
- assertNotVisible:
    id: tab-Today
- takeScreenshot: guest_startup

# The platform account is the path for courses, assignments and merchant work.
- scrollUntilVisible:
    element:
      id: login-start
    direction: DOWN
- assertVisible: 'Google 帳號'
- tapOn:
    id: login-start
# The navigation target is valid even when the remote session check fails.
# The offline/error state must not pretend that a Google login succeeded.
- extendedWaitUntil:
    visible:
      id: nuni-workspace
    timeout: 20000
- takeScreenshot: platform_account_state

# On iOS the navigation header owns the back action; a device-level back gesture
# does not reliably pop the React Navigation stack.
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
# The campus import entry is always available, even when student-ID login is not.
- scrollUntilVisible:
    element:
      id: school-import-start
    direction: UP
- assertVisible:
    id: school-import-start
# School-issued sign-in is hidden unless a verified provider is available.
# Both states must show a truthful explanation; never assume school login works.
- runFlow:
    when:
      visible:
        id: school-login-start
    commands:
      - assertNotVisible:
          id: school-login-hint
- runFlow:
    when:
      visible:
        id: school-login-hint
    commands:
      - assertNotVisible:
          id: school-login-start
- takeScreenshot: school_login_availability
