name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  security-gates:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        # 保留 moderate 以上完整報告；自動阻擋門檻目前為 critical。
        # 通過此步驟不代表 high 已修復；可達性與處置記錄見 CAMPUS_ONE_INTEGRATION.md。
        run: |
          pnpm audit --prod --audit-level moderate --json > audit-report.json || true
          pnpm audit --prod --audit-level critical

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 7

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test-mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile tests and produce a real report
        # The mobile test script already supplies --runInBand.
        # Coverage is intentionally not claimed: the CI Jest coverage path
        # still needs a separate dependency-resolution fix.
        env:
          TZ: Asia/Taipei
        run: pnpm --filter mobile test --ci --json --outputFile=jest-results.json

      - name: Verify report and publish test counts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/mobile/jest-results.json';
          if (!fs.existsSync(path)) throw new Error('Jest result file was not generated');
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Number.isInteger(report.numTotalTests) || report.numTotalTests === 0) {
            throw new Error('Jest result file has no tests');
          }
          if (report.numFailedTests > 0 || report.success === false) {
            throw new Error('Jest JSON report contains failures');
          }
          const summary = [
            '## Mobile Jest test report',
            '',
            '| Result | Count |',
            '|---|---:|',
            '| Passed | ' + report.numPassedTests + ' |',
            '| Failed | ' + report.numFailedTests + ' |',
            '| Skipped | ' + report.numPendingTests + ' |',
            '| Total | ' + report.numTotalTests + ' |',
            '',
            'Report artifact: mobile-jest-results. Coverage is not collected by this job.',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log('Validated Jest report:', path);
          NODE

      - name: Upload Jest test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-jest-results
          path: apps/mobile/jest-results.json
          if-no-files-found: error
          retention-days: 14

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        # vitest 4 不接受 --ci flag（vitest run 已預設 CI-friendly）；
        # --coverage 需要 @vitest/coverage-v8（已在 devDeps）。
        run: pnpm --filter web exec vitest run --coverage

  test-functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run functions tests
        run: pnpm --filter functions test --runInBand

  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security rules tests
        run: pnpm test:rules

  build-mobile:
    name: Build Mobile
    runs-on: ubuntu-latest
    needs: [security-gates, lint-and-typecheck, test-mobile, test-functions, test-rules]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Bundle mobile JavaScript
        working-directory: apps/mobile
        env:
          APP_ENV: development
          EXPO_PUBLIC_APP_ENV: development
        run: |
          pnpm exec expo export --platform ios --output-dir /tmp/campus-ios-export
          pnpm exec expo export --platform android --output-dir /tmp/campus-android-export

      - name: Validate Expo app config
        working-directory: apps/mobile
        run: npx expo config --type public --json > /tmp/expo-config.json

      - name: Validate EAS build profiles
        working-directory: apps/mobile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));

          for (const name of ['development', 'preview', 'production']) {
            if (!config.build?.[name]) {
              throw new Error(`Missing EAS build profile: ${name}`);
            }
          }

          if (config.build?.base?.node !== '22.12.0') {
            throw new Error('EAS base Node must be 22.12.0');
          }
          if (config.build?.base?.pnpm !== '10.28.2') {
            throw new Error('EAS base pnpm must be 10.28.2');
          }
          if (config.build?.preview?.android?.buildType !== 'apk') {
            throw new Error('Preview Android profile must produce an APK');
          }
          if (config.build?.production?.android?.buildType !== 'app-bundle') {
            throw new Error('Production Android profile must produce an app bundle');
          }

          console.log('EAS build profiles are structurally valid.');
          NODE

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [security-gates, lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'mock-api-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'mock.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'mock-project' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  deploy-functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    needs:
      [
        security-gates,
        lint-and-typecheck,
        test-mobile,
        test-web,
        test-functions,
        test-rules,
        build-mobile,
        build-web,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set FIREBASE_PROJECT_ID in the production environment variables."
            exit 1
          fi
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Set FIREBASE_TOKEN in the production environment secrets."
            exit 1
          fi
          if [[ ! "$FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || [ "$FIREBASE_PROJECT_ID" = "default" ]; then
            echo "::error::FIREBASE_PROJECT_ID must be an explicit Firebase project ID, not a local alias."
            exit 1
          fi
          pnpm -w firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
          pnpm -w firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        security-gates,
        lint-and-typecheck,
        test-mobile,
        test-web,
        test-functions,
        test-rules,
        build-mobile,
        build-web,
      ]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gates | ${{ needs.security-gates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Tests | ${{ needs.test-mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Tests | ${{ needs.test-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions Tests | ${{ needs.test-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rules Tests | ${{ needs.test-rules.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Mobile | ${{ needs.build-mobile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Web | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
