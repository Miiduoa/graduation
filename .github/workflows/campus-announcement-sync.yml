# 晉瑋已核准：每天兩次同步目錄內全部可抓學校公告（台北 07:00、11:30）；只寫 schools/{schoolId}/announcements 與 announcement-sources。
# 排程與手動共用同一份目錄名單（排除三間示範校）；單一學校失敗就略過並記錄，不要停整批。
# 要停：拿掉 schedule，或刪掉 production 環境的 CAMPUS_ANNOUNCEMENT_SYNC_ENABLED。
name: Campus announcement sync

on:
  schedule:
    - cron: '0 23 * * *' # 07:00 Taipei，早上第一堂前
    - cron: '30 3 * * *' # 11:30 Taipei，中午尖峰前
  workflow_dispatch:
    inputs:
      school:
        description: 'schoolId；留空則同步目錄內全部可抓學校'
        required: false
        default: ''
        type: string
      write:
        description: 'Write to Firestore. Keep false unless production write is approved.'
        required: false
        default: false
        type: boolean
      probe:
        description: 'Also dry-run extra schools without writing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: campus-announcement-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Preview or sync campus announcements
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SCHOOL_ID: ${{ inputs.school || '' }}
      WRITE: ${{ github.event_name == 'schedule' || inputs.write == true }}
    steps:
      - name: Require main for production announcement sync
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::正式環境公告同步只能從 main 觸發。目前 ref 是 ${{ github.ref }}。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter functions...

      - name: Dry-run
        if: ${{ env.WRITE != 'true' }}
        run: |
          if [ -n "$SCHOOL_ID" ]; then
            pnpm --filter functions sync:announcements --school "$SCHOOL_ID"
          else
            pnpm --filter functions sync:announcements --all
          fi

      - name: Sync to Firestore
        if: ${{ env.WRITE == 'true' }}
        env:
          CAMPUS_ANNOUNCEMENT_SYNC_ENABLED: ${{ secrets.CAMPUS_ANNOUNCEMENT_SYNC_ENABLED }}
          ANNOUNCEMENT_SYNC_SA_JSON: ${{ secrets.ANNOUNCEMENT_SYNC_SA_JSON }}
        run: |
          if [ -z "$ANNOUNCEMENT_SYNC_SA_JSON" ]; then
            echo "::error::缺少 ANNOUNCEMENT_SYNC_SA_JSON"
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/announcement-sync-sa.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$ANNOUNCEMENT_SYNC_SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          if [ -n "$SCHOOL_ID" ]; then
            pnpm --filter functions sync:announcements --school "$SCHOOL_ID" --write
          else
            pnpm --filter functions sync:announcements --all --write
          fi

  probe:
    name: Probe extra schools
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter functions...

      - name: Dry-run extra schools without writing
        run: pnpm --filter functions sync:announcements:probe -- --schools ncku,ntpu
