name: Credit Deadline Checks
on:
  pull_request:
    paths:
      - 'packages/shared/src/creditScenarioDeadline.ts'
      - 'packages/shared/src/creditPlanner.ts'
      - 'packages/shared/src/creditPlanScenarios.ts'
      - 'packages/shared/tests/creditScenarioDeadline.test.cjs'
      - 'apps/web/src/components/academic/Credit*Scenario*'
      - 'apps/mobile/src/screens/creditAudit/Credit*Scenario*'
      - 'apps/mobile/src/__tests__/CreditScenarioDeadlineCard.test.tsx'
      - 'scripts/qa/credit-deadline-browser.mjs'
      - '.github/workflows/credit-deadline-checks.yml'
permissions:
  contents: read
concurrency:
  group: credit-deadline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile and test the exact shared deadline engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/credit-deadline-browser
          pnpm --filter @campus/shared exec tsc src/creditPlanner.ts src/creditScenarioDeadline.ts --strict --skipLibCheck --target es2022 --module commonjs --outDir ../../artifacts/credit-deadline-core
          node --test packages/shared/tests/creditScenarioDeadline.test.cjs | tee artifacts/credit-deadline-browser/core-tests.tap
      - name: Test real Web component integration
        run: pnpm --filter web exec vitest run src/components/academic/CreditScenarioDeadline.test.tsx --reporter=json --outputFile=../../artifacts/credit-deadline-browser/web-tests.json
      - name: Prepare Chinese browser fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise deadline changes in real Chrome
        run: node scripts/qa/credit-deadline-browser.mjs
      - name: Preserve exact-head reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: credit-deadline-browser
          path: artifacts/credit-deadline-browser
          retention-days: 14
