name: Firestore rules check

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'backend/firestore/**'
      - 'backend/storage/**'
      - 'backend/tests/**'
      - 'backend/functions/**'
      - 'firebase.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rules:
    name: Security rules and transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firestore and Storage rules
        run: pnpm test:rules
