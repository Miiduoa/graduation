appId: ${APP_ID}
---
# Real Firebase Auth emulator password authentication. No local mock session or
# role switch is installed. The existing scripts/test-env/seed.cjs owns this
# public, non-production fixture password; the test entrypoint pins loopback.
- runFlow: open-emulator-login.yaml
- inputText: 'campus-test-1234' # gitleaks:allow public loopback emulator fixture
# Password keyboard on iOS has Return/Go, not a hide-keyboard control. The
# sign-in button sits above the keyboard; tapping it is the real submit.
# Overlay dismiss without auth leaves login-landing (校園服務) with no tabs.
# Only reopen the sheet while still on login-landing. After a slow but
# successful sign-in, Today is already showing and the overlay trigger is gone.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: login-landing
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: maestro-sign-in
                commands:
                  - tapOn:
                      id: maestro-open-emulator-login
                      enabled: true
                  - extendedWaitUntil:
                      visible:
                        id: maestro-emulator-login
                      timeout: 15000
                  - tapOn:
                      id: maestro-email
                  - eraseText: 80
                  - inputText: 's0000001@test.campus-one.local'
                  - tapOn:
                      id: maestro-password
                  - eraseText: 40
                  - inputText: 'campus-test-1234' # gitleaks:allow public loopback emulator fixture
            - tapOn:
                id: maestro-sign-in
                enabled: true
                retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: tab-Today
          timeout: 90000
- assertNotVisible:
    id: login-landing
- assertNotVisible:
    id: maestro-emulator-login
- extendedWaitUntil:
    visible:
      id: student-today
    timeout: 30000
