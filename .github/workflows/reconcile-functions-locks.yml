name: Reconcile Functions dependency locks
on:
  pull_request:
    paths:
      - backend/functions/package.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/reconcile-functions-locks.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Regenerate workspace lock
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Regenerate isolated Functions lock
        run: npm install --package-lock-only --ignore-scripts --prefix backend/functions
      - name: Confirm both frozen installers accept generated locks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm ci --prefix backend/functions --ignore-scripts
      - name: Export reconciled locks for review
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-zod4-lockfiles
          path: |
            pnpm-lock.yaml
            backend/functions/package-lock.json
          if-no-files-found: error
          retention-days: 2
