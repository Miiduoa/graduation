name: Timetable Browser
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/components/timetable/**'
      - 'apps/web/src/components/ui/Modal*'
      - 'apps/web/src/components/ui/modalSession*'
      - 'scripts/timetable-browser-smoke.py'
      - '.github/workflows/timetable-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timetable-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest-interactions:
    name: Guest timetable interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Build Web
        run: pnpm --filter web build
      - name: Exercise production guest timetable
        run: |
          mkdir -p artifacts/timetable-browser
          pnpm --filter web start --hostname 127.0.0.1 --port 3100 > artifacts/timetable-browser/server.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          node --input-type=module - <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try { if ((await fetch('http://127.0.0.1:3100/timetable')).ok) { ready = true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Web server did not become ready');
          NODE
          python scripts/timetable-browser-smoke.py
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-browser
          path: artifacts/timetable-browser
          retention-days: 7
