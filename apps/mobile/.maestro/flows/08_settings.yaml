# 08_settings.yaml
# 頭像抽屜 → 一般設定（SettingsScreen）

appId: ${APP_ID}
name: Settings Flow
tags:
  - smoke
  - settings

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible:
      id: 'header-avatar-button'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- scrollUntilVisible:
    element:
      text: '一般設定'
    direction: DOWN
    timeout: 20000

- tapOn:
    text: '一般設定'

- extendedWaitUntil:
    visible: '主題模式'
    timeout: 10000

- takeScreenshot: settings_screen

- tapOn:
    text: '深色'
    optional: true

- takeScreenshot: settings_dark_mode_optional

- tapOn:
    text: '無障礙設定'

- extendedWaitUntil:
    visible: '文字大小'
    timeout: 10000

- takeScreenshot: accessibility_settings

- tapOn:
    text: '大'
    optional: true

- takeScreenshot: accessibility_large_text

- back

- tapOn:
    text: '語言設定'

- extendedWaitUntil:
    visible: '可用語言'
    timeout: 10000
    optional: true

- takeScreenshot: language_settings

- tapOn:
    text: 'English'
    optional: true

- takeScreenshot: settings_english

- tapOn:
    text: '繁體中文'
    optional: true

- back

- scrollUntilVisible:
    element:
      text: '匯出我的資料'
    direction: DOWN

- tapOn:
    text: '匯出我的資料'

- extendedWaitUntil:
    visible: '資料匯出'
    timeout: 10000
    optional: true

- takeScreenshot: data_export

- back
