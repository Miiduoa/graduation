name: Transit contract checks

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/transit*.ts'
      - 'apps/web/src/app/api/transit/**'
      - 'scripts/test-transit.cjs'
      - '.github/workflows/transit.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/transit*.ts'
      - 'apps/web/src/app/api/transit/**'
      - 'scripts/test-transit.cjs'
      - '.github/workflows/transit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated test compiler
        run: npm install --prefix "$RUNNER_TEMP/transit-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Strict transit module types
        run: >-
          "$RUNNER_TEMP/transit-tools/node_modules/.bin/tsc"
          --noEmit --strict --target es2022 --lib es2022,dom --module commonjs
          apps/web/src/lib/transit.ts apps/web/src/lib/transit-server.ts
      - name: Transit API and data contract tests
        env:
          NODE_PATH: ${{ runner.temp }}/transit-tools/node_modules
        run: node --test scripts/test-transit.cjs
