appId: ${APP_ID}
name: Guest campus map access
tags:
  - smoke
  - map
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000

- assertVisible:
    id: public-Map

- tapOn:
    id: public-Map

- extendedWaitUntil:
    visible: '校園地圖'
    timeout: 20000

- takeScreenshot: map_guest_opened

# Both data-backed maps and explicit unavailable states are valid offline.
- extendedWaitUntil:
    visible: '校區位置|尚未提供校園地點|目前無法讀取校園地點'
    timeout: 45000

- takeScreenshot: map_guest_source_state

- tapOn:
    text: '返回'

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
