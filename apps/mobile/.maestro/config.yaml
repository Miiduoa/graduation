# Maestro E2E Testing Configuration
# https://maestro.mobile.dev/

# Global configuration
appId: ${APP_ID}
name: Campus App E2E Tests

# Authenticated flows use the public demo-campus-one emulator fixture through
# helpers/sign-in-student.yaml. No production credentials are accepted.

# Flows directory
flows:
  - ./flows/

# Screenshots directory
screenshots:
  - ./screenshots/

# Test artifacts
artifacts:
  directory: ./artifacts/

# Timeout settings
timeout:
  default: 30000 # 30 seconds
  flow: 300000 # 5 minutes per flow

# Retry settings
retry:
  enabled: true
  maxAttempts: 3
