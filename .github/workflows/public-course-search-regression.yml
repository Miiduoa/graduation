name: Public Course Search Regression

on:
  pull_request:
    branches: [main, develop, integration/all-branches-20261124-final]
    paths:
      - 'apps/web/src/app/school-courses/**'
      - '.github/workflows/public-course-search-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-course-search-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-course-search:
    name: Public catalog freshness and timetable handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public catalog search, freshness and import
        run: pnpm --filter web test src/app/school-courses/PublicCourseSearch.test.tsx
