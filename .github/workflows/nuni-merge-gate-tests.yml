name: nuni merge gate policy tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/merge-gate/**'
      - '.github/workflows/nuni-merge-gate*.yml'
      - 'docs/security/nuni-merge-gate.md'
      - '.github/workflows/maestro-e2e.yml'
      - '.github/workflows/mobile-agent-regression.yml'
      - '.github/workflows/campus-spatial-browser.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/merge-gate/**'
      - '.github/workflows/nuni-merge-gate*.yml'
      - 'docs/security/nuni-merge-gate.md'
      - '.github/workflows/maestro-e2e.yml'
      - '.github/workflows/mobile-agent-regression.yml'
      - '.github/workflows/campus-spatial-browser.yml'
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --test scripts/merge-gate/*.test.mjs
      - run: python3 scripts/merge-gate/maestro-reports.test.py
