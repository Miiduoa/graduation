name: Student Card NFC

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/modules/campus-student-card-nfc/**'
      - 'apps/mobile/app.config.ts'
      - '.github/workflows/student-card-nfc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-card-nfc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android NFC compilation and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check native configuration
        run: node --test apps/mobile/modules/campus-student-card-nfc/native-config.test.cjs
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile the native bridge and run APDU regressions
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :campus-student-card-nfc:compileDebugKotlin
          :campus-student-card-nfc:testDebugUnitTest
          --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
          -PreactNativeArchitectures=arm64-v8a
      - name: Preserve protocol test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: student-card-nfc-android-tests
          path: apps/mobile/modules/campus-student-card-nfc/android/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
