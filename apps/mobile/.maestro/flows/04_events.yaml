appId: ${APP_ID}
name: Authenticated event filters and detail
tags: [smoke, events]
---
- runFlow: ../helpers/sign-in-student.yaml
- openLink: campus://events
- extendedWaitUntil:
    visible: '查看時間、地點與主辦單位資訊。'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '未來活動'
    direction: DOWN
    timeout: 30000
- tapOn: '未來活動'
- scrollUntilVisible:
    element:
      text: 'Maestro 校園測試活動'
    direction: DOWN
    timeout: 20000
- tapOn: 'Maestro 校園測試活動'
- extendedWaitUntil:
    visible: '活動詳情'
    timeout: 15000
- assertVisible: '測試教室'
- scrollUntilVisible:
    element:
      text: '本機模擬器活動內容。'
    direction: DOWN
    timeout: 15000
- takeScreenshot: event_seeded_detail
