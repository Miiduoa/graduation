# CodeQL 進階設定：JavaScript／TypeScript 語意分析。
# 官方支援：github/codeql-action@v4；解譯語言必須使用 build-mode: none。
# 僅使用 pull_request（非 pull_request_target），避免以寫入權限執行未信任 PR 程式碼。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每週一 05:40 UTC（約台北 13:40）
    - cron: '40 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # 私有儲存庫取得 CodeQL action／套件時需要
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
