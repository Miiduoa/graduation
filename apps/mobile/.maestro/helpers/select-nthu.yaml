appId: ${APP_ID}

---
- tapOn:
    id: school-picker-open
- extendedWaitUntil:
    visible:
      id: school-picker-search
    timeout: 15000
# Native input can report completion while the field contains only a prefix.
# Retry only text entry, clearing the previous attempt before checking its echo.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: school-picker-search
          enabled: true
      - waitForAnimationToEnd:
          timeout: 5000
      - eraseText: 4
      - inputText: 'NTHU'
      - assertVisible:
          id: school-picker-search
          text: '^NTHU$'
- extendedWaitUntil:
    visible:
      id: school-picker-option-nthu
    timeout: 20000
- tapOn:
    id: school-picker-option-nthu
- extendedWaitUntil:
    visible: '目前瀏覽國立清華大學，選擇其他學校'
    timeout: 15000
