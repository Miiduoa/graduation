name: Campus story media regression

on:
  push:
    branches:
      - 'feat/story-*'
      - 'feature/campus-story-video'
    paths:
      - 'apps/web/src/app/community/_components/StoryViewer*'
      - 'apps/mobile/src/screens/social/CampusStoryViewer.tsx'
      - 'apps/mobile/src/__tests__/CampusStoryViewer.test.tsx'
      - '.github/workflows/campus-story-media-regression.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'feat/story-private-replies'
    paths:
      - 'apps/web/src/app/community/_components/StoryViewer*'
      - 'apps/mobile/src/screens/social/CampusStoryViewer.tsx'
      - 'apps/mobile/src/__tests__/CampusStoryViewer.test.tsx'
      - '.github/workflows/campus-story-media-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-regression:
    name: Photo retry and viewer regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Web story viewer interaction tests
        run: pnpm --filter web exec vitest run src/app/community/_components/StoryViewer.test.tsx
      - name: Mobile story viewer interaction tests
        run: pnpm --filter mobile exec jest src/__tests__/CampusStoryViewer.test.tsx --runInBand --ci
      - name: Typecheck web and mobile viewer integration
        run: |
          pnpm --filter web typecheck
          pnpm --filter mobile typecheck
