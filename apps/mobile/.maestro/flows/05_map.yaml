appId: ${APP_ID}
name: Guest campus map access
tags:
  - smoke
  - map
---
# The workflow installs one iOS Debug app and runs onboarding before this flow.
# Maestro's clearState reinstalls the app on iOS and can discard the Metro
# Debug bundle URL; the saved failure screenshot showed a native
# "No script URL provided" redbox, not a failed guest map assertion.
# Restart the installed app without resetting its native Debug configuration.
# Guest isolation is still explicitly checked below before any map action.
- launchApp

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertNotVisible:
    id: tab-Today

# Keep the tap target clear of the development warning banner at the screen edge.
# A cold iOS accessibility swipe can exceed 20s; allow subsequent swipes to run.
- scrollUntilVisible:
    element:
      id: public-Map
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    id: public-Map

- tapOn:
    id: public-Map

# The landing-page button also says "校園地圖"; require the map-only subtitle.
- extendedWaitUntil:
    visible: '找到校園地點，再安排怎麼過去。'
    timeout: 20000

- assertNotVisible:
    id: login-landing

- takeScreenshot: map_guest_opened

# Both data-backed maps and explicit unavailable states are valid offline.
- extendedWaitUntil:
    visible: '校區位置|尚未提供校園地點|目前無法讀取校園地點'
    timeout: 45000

- takeScreenshot: map_guest_source_state

- tapOn:
    text: '返回'

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
