name: Role Workflows Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/components/AccountIdentity*'
      - 'apps/web/src/components/AccountWorkspaces*'
      - 'apps/web/src/components/ui/Button*'
      - 'apps/web/src/components/ui/Input*'
      - 'apps/web/src/lib/accountIdentity*'
      - 'apps/web/src/features/merchant/**'
      - 'apps/web/src/features/food/foodState*'
      - 'apps/web/src/features/food/foodPersistence*'
      - 'apps/web/src/features/food/foodOrderGuidance*'
      - 'apps/web/src/features/food/Food.module.css'
      - 'apps/web/src/app/merchant/**'
      - 'apps/web/src/app/globals.css'
      - 'packages/shared/src/merchantJourney.ts'
      - 'packages/shared/src/nuni.ts'
      - 'packages/shared/src/nuniMerchant*'
      - 'packages/shared/src/nuniFood*'
      - 'scripts/qa/role-workflows/**'
      - 'scripts/qa/browser/**'
      - 'apps/web/tsconfig.json'
      - 'apps/web/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/role-workflows-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-workflows-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-workflows:
    name: Role entry, recovery and merchant journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and Chinese fonts
        timeout-minutes: 10
        run: |
          python -m pip install playwright==1.57.0
          # Let apt finish: an unprivileged timeout can leave Playwright's
          # root-owned apt process holding the dpkg lock across retries.
          python -m playwright install --with-deps chromium
          sudo apt-get -o DPkg::Lock::Timeout=180 \
            -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 \
            -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Bundle actual role components with isolated API
        run: node scripts/qa/role-workflows/build.mjs
      - name: Check role recovery, responsive layout and merchant drafts
        run: python scripts/qa/role-workflows/check.py
      - name: Upload screenshots, source hashes and interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: role-workflows-browser
          path: artifacts/role-workflows
          retention-days: 7
