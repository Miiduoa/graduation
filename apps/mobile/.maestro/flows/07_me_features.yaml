# 07_me_features.yaml
# 「我的」已改為隱藏 Tab：由左上角頭像開啟 HeaderDrawer，再進入各功能

appId: com.campus.app
name: Me Features (Header Drawer)
tags:
  - smoke
  - me

---

- launchApp

- extendedWaitUntil:
    visible: '公告'
    timeout: 10000


# 開啟頭像抽屜
- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 5000


- takeScreenshot: drawer_open

# QR 碼
- tapOn:
    text: '我的 QR Code'

- extendedWaitUntil:
    visible: 'QR 碼'
    timeout: 5000


- takeScreenshot: qr_code_screen

- back

# 返回抽屜或直接回 today：再開抽屜較穩
- tapOn:
    id: 'header-avatar-button'
    optional: true

- tapOn:
    text: '成就與積分'

- extendedWaitUntil:
    visible: '成就與積分'
    timeout: 5000


- takeScreenshot: achievements_screen

- back
