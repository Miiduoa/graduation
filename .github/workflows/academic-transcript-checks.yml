name: Academic transcript checks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/app/grades/**'
      - 'apps/web/src/lib/gradeTranscript*'
      - 'apps/web/src/lib/academicRecords*'
      - 'apps/web/src/components/academic/**'
      - 'apps/web/src/app/globals.css'
      - 'scripts/qa/academic-transcript-browser.mjs'
      - '.github/workflows/academic-transcript-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-transcript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcript:
    name: Transcript regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run transcript regression
        id: tests
        # 專項報告不取代原有完整 CI，也不調整其覆蓋率或其他發布門檻。
        run: >-
          pnpm --filter web exec vitest run
          src/lib/gradeTranscript.test.ts
          src/app/grades/page.test.tsx
          src/components/academic/AcademicPage.test.tsx
          src/lib/academicRecords.test.ts
          --reporter=json --outputFile=academic-transcript-results.json
      - name: Summarize exact test results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('apps/web/academic-transcript-results.json', 'utf8'));
          if (!Number.isSafeInteger(report.numTotalTests) || report.numTotalTests <= 0) {
            throw new Error('成績專項報告沒有可確認的測試紀錄');
          }
          const summary = `Passed: ${report.numPassedTests}; Failed: ${report.numFailedTests}; Skipped: ${report.numPendingTests}; Total: ${report.numTotalTests}`;
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## 校務成績專項回歸\n\n${summary}\n\n完整結果：academic-transcript-results。這不是校方真實帳號或裝置驗收。\n`);
          for (const suite of report.testResults || []) {
            if (suite.status === 'failed') console.log('Failed file:', suite.name);
            for (const test of suite.assertionResults || []) {
              if (test.status !== 'failed') continue;
              console.log('Failed test:', test.fullName);
              for (const message of test.failureMessages || []) console.log(String(message).slice(0, 2000));
            }
          }
          if (report.success !== true || report.numFailedTests > 0 || report.numFailedTestSuites > 0) {
            process.exitCode = 1;
          }
          NODE
      - name: Prepare browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          google-chrome --version
      - name: Verify actual transcript UI and CSV download
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/qa/academic-transcript-browser.mjs
      - name: Preserve regression report
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: academic-transcript-results
          path: |
            apps/web/academic-transcript-results.json
            artifacts/academic-transcript-browser/
          if-no-files-found: error
          retention-days: 7
