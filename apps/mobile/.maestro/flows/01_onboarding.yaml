appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# Guest access must not depend on a Google or university login.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertVisible:
    id: public-Map
- assertNotVisible:
    id: tab-Today
- takeScreenshot: guest_startup

# The platform account is the path for courses, assignments and merchant work.
- scrollUntilVisible:
    element:
      id: login-start
    direction: DOWN
- assertVisible: 'Google 帳號'
- tapOn:
    id: login-start
# Assert the visible terminal state rather than a non-interactive page container.
# The iOS failure artifact contains nuni-workspace in its hierarchy while its
# visible heading and recovery controls are rendered as separate native nodes.
# A remote session failure is not a successful login; recovery must remain usable.
- extendedWaitUntil:
    visible:
      text: '登入或建立帳號|目前無法確認登入狀態|登出尚未完成'
    timeout: 20000
- assertNotVisible:
    id: login-landing
- assertNotVisible: '登出 Google 帳號'
- runFlow:
    when:
      visible: '目前無法確認登入狀態'
    commands:
      - assertVisible:
          text: '重新確認登入狀態'
          enabled: true
      - assertVisible:
          text: '開啟網頁版登入'
          enabled: true
      - assertNotVisible: '申請學校資格'
- runFlow:
    when:
      visible: '登出尚未完成'
    commands:
      - assertVisible:
          text: '重試登出'
          enabled: true
- runFlow:
    when:
      visible: '登入或建立帳號'
    commands:
      - assertVisible:
          text: '使用 Google 繼續|開啟網頁版登入'
          enabled: true
- takeScreenshot: platform_account_state

# On iOS the navigation header owns the back action; a device-level back gesture
# does not reliably pop the React Navigation stack.
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
# The campus import entry is always available, even when student-ID login is not.
- scrollUntilVisible:
    element:
      id: school-import-start
    direction: UP
- assertVisible:
    id: school-import-start
# School-issued sign-in is hidden unless a verified provider is available.
# Both states must show a truthful explanation; never assume school login works.
- runFlow:
    when:
      visible:
        id: school-login-start
    commands:
      - assertNotVisible:
          id: school-login-hint
- runFlow:
    when:
      visible:
        id: school-login-hint
    commands:
      - assertNotVisible:
          id: school-login-start
- takeScreenshot: school_login_availability
