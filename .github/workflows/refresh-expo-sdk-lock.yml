name: refresh-expo-sdk-lock

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/refresh-expo-sdk-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-expo-sdk-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify Expo SDK package alignment
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "refresh Expo SDK lockfile"
          git push
