# Verify model tool-call parameter conversion under both Zod major versions.
# The v4 install is temporary and does not change package manifests or locks.
name: Assistant Zod Schema Compatibility

on:
  pull_request:
    paths:
      - 'backend/functions/assistantAgent.js'
      - 'backend/functions/agent/tools/toolSchema.compat.test.js'
      - '.github/workflows/zod-tool-compat.yml'
  push:
    branches: [main]
    paths:
      - 'backend/functions/assistantAgent.js'
      - 'backend/functions/agent/tools/toolSchema.compat.test.js'
      - '.github/workflows/zod-tool-compat.yml'

permissions:
  contents: read

jobs:
  zod-tool-contracts:
    name: Run assistant tool contracts under Zod 3 and 4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install full workspace and compile Functions shared types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter functions run build:shared
      - name: Verify existing Zod 3 runtime
        working-directory: backend/functions
        run: |
          node -p "require('zod/package.json').version"
          pnpm exec jest --runInBand agent/tools/toolSchema.compat.test.js agent/tools/campusNavigation.test.js assistantAgent.test.js
      - name: Install Zod 4 in this disposable runner only
        run: |
          npm install --prefix backend/functions --no-save --ignore-scripts --package-lock=false 'zod@4.6.7'
          # This is a deliberate cross-major compatibility probe. The checked-in
          # manifest still pins Zod 3 until the actual migration PR.
          node -e "const version = require('./backend/functions/node_modules/zod/package.json').version; if (!version.startsWith('4.6.7')) process.exit(1); console.log(version)"
      - name: Verify full Functions suite under Zod 4
        working-directory: backend/functions
        env:
          ONLINE_ORDERING_ENABLED: 'true'
        run: |
          node -p "require('zod/package.json').version"
          pnpm exec jest --runInBand
