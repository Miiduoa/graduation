name: Web test diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/web-test-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: web-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Web failure report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the complete Web suite with the existing coverage gate
        run: pnpm --filter web exec vitest run --coverage --reporter=json --outputFile=web-vitest-results.json > web-vitest.log 2>&1
      - name: Print bounded failure details
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/web-vitest-results.json';
          if (fs.existsSync(path)) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failed = (report.testResults || []).flatMap(suite => {
              const assertions = (suite.assertionResults || []).filter(test => test.status === 'failed');
              return assertions.length
                ? assertions.map(test => ({ file: suite.name, test: test.fullName, messages: test.failureMessages }))
                : suite.status === 'failed' ? [{ file: suite.name, messages: [suite.message] }] : [];
            });
            console.log(JSON.stringify({ success: report.success, passed: report.numPassedTests,
              failed: report.numFailedTests, pending: report.numPendingTests,
              failures: failed.slice(0, 10) }, null, 2).slice(0, 16000));
          } else {
            console.log('No JSON report; inspect the preserved diagnostic log.');
          }
          if (fs.existsSync('web-vitest.log')) {
            console.log(fs.readFileSync('web-vitest.log', 'utf8').split('\n').slice(-35).join('\n').slice(-8000));
          }
          NODE
      - name: Preserve report and diagnostic log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-diagnostics
          path: |
            apps/web/web-vitest-results.json
            web-vitest.log
          if-no-files-found: error
          retention-days: 7
