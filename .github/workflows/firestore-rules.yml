name: Firestore rules check

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'backend/firestore/**'
      - 'backend/storage/**'
      - 'backend/tests/**'
      - 'backend/functions/**'
      - 'apps/mobile/src/services/dmAttachments.ts'
      - 'apps/mobile/src/services/mediaUpload.ts'
      - 'apps/mobile/src/__tests__/services/dmAttachments.test.ts'
      - 'apps/**/[dD]mPhotos*'
      - 'apps/**/dmConversations*'
      - 'apps/mobile/src/screens/ChatScreen.tsx'
      - 'apps/mobile/src/__tests__/ChatScreen.dmSend.test.tsx'
      - 'apps/web/src/components/messaging/Messaging*.tsx'
      - 'apps/web/src/components/messaging/NewPrivateConversation*.tsx'
      - 'apps/web/src/lib/privateMessages*.ts'
      - 'apps/web/src/app/dms/**'
      - 'apps/web/src/app/friends/page*.tsx'
      - 'apps/web/src/components/academic/academic.module.css'
      - 'firebase.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rules:
    name: Security rules and transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firestore and Storage rules
        run: pnpm test:rules

      - name: Verify DM creation, media token revocation and authorized delivery
        run: pnpm --filter functions exec jest dmConversations.test.js dmAttachmentDelivery.test.js dmAttachmentTokenMigration.test.js dmPhotos.test.js --runInBand

      - name: Verify mobile DM signed delivery and failure cases
        run: pnpm --filter mobile exec jest src/__tests__/services/dmConversations.test.ts src/__tests__/services/dmAttachments.test.ts src/__tests__/services/dmPhotos.test.ts src/__tests__/ChatScreen.dmSend.test.tsx --runInBand

      - name: Verify web private photo send, retry and access
        run: pnpm --filter web exec vitest run src/lib/dmPhotos.test.ts src/lib/privateMessages.test.ts src/components/messaging/Messaging.test.tsx src/components/messaging/NewPrivateConversation.test.tsx src/app/friends/page.test.tsx

      - name: Typecheck mobile messaging integration
        run: pnpm --filter mobile typecheck

      - name: Typecheck web messaging integration
        run: pnpm --filter web typecheck

      - name: Lint web messaging routes and services
        run: |
          pnpm --filter web exec eslint \
            src/app/dms/new/page.tsx src/app/friends/page.tsx src/app/friends/page.test.tsx \
            src/components/messaging/Messaging.tsx src/components/messaging/Messaging.test.tsx \
            src/components/messaging/NewPrivateConversation.tsx src/components/messaging/NewPrivateConversation.test.tsx \
            src/components/messaging/DmPhotos.tsx src/lib/dmPhotos.ts src/lib/dmPhotos.test.ts \
            src/lib/privateMessages.ts src/lib/privateMessages.test.ts

      - name: Build web messaging routes
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: mock-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mock.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: mock-project

      - name: Preserve failed emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-rules-failure-logs
          path: |
            firestore-debug.log
            storage-debug.log
          if-no-files-found: ignore
          retention-days: 7
