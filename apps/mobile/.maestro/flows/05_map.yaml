# 05_map.yaml
# 校園 Tab → 校園地圖

appId: ${APP_ID}
name: Map Flow
tags:
  - smoke
  - map

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    id: 'tab-校園'

- extendedWaitUntil:
    visible: '搜尋服務、地點、功能'
    timeout: 20000

- scrollUntilVisible:
    element:
      id: 'e2e-campus-open-map'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-campus-open-map'

- extendedWaitUntil:
    visible: '校園地圖'
    timeout: 15000

- takeScreenshot: map_screen

- tapOn:
    text: '全部'
    optional: true

- tapOn:
    text: '教學大樓'
    optional: true

- takeScreenshot: map_buildings

- tapOn:
    text: '圖書館'
    optional: true

- takeScreenshot: map_library

- tapOn:
    text: '餐廳'
    optional: true

- takeScreenshot: map_cafeteria

- tapOn:
    text: '全部'
    optional: true

- tapOn:
    index: 0
    below:
      text: '地圖'
    optional: true

- extendedWaitUntil:
    visible: '導航'
    timeout: 8000
    optional: true

- takeScreenshot: poi_detail

- tapOn:
    text: '導航'
    optional: true

- tapOn:
    text: 'AR 實景導航'
    optional: true

- back
