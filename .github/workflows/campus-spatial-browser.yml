name: Campus Spatial Browser

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-spatial-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify spatial PR paths
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: /scripts/merge-gate/pr-scope.mjs
          sparse-checkout-cone-mode: false
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/merge-gate/pr-scope.mjs spatial

  browser:
    needs: scope
    if: >-
      always() && !cancelled() && (github.event_name != 'pull_request' ||
      (needs.scope.result == 'success' && needs.scope.outputs.required == 'true'))
    name: Spatial explorer browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser installer retry behavior
        run: bash scripts/qa/browser/install-playwright.test.sh
      - name: Install Chromium test tools
        run: |
          python -m pip install playwright==1.57.0
          bash scripts/qa/browser/install-playwright.sh
      - name: Build production component fixture
        run: node scripts/qa/campus-spatial/build.mjs
      - name: Check local interactions and real WebGL recovery
        run: |
          python scripts/qa/campus-spatial/check.py
          python scripts/qa/campus-spatial/building-check.py
          python scripts/qa/campus-spatial/svg-download-check.py
          python scripts/qa/campus-spatial/png-download-check.py
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campus-spatial-browser
          path: artifacts/campus-spatial
          retention-days: 7

  pr-result:
    # Even a skipped job can satisfy a required check. Only a PR targeting main uses the required name.
    name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'Spatial browser PR result' || 'Spatial browser other result' }}
    if: always() && github.event_name == 'pull_request'
    needs: [scope, browser]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the applicable test result
        env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          TEST: ${{ needs.browser.result }}
        run: |
          case "$SCOPE/$REQUIRED/$TEST" in
            success/true/success) echo 'Required suite passed' ;;
            success/false/skipped) echo 'Suite is outside this PR diff' ;;
            *) echo "::error::Unverified suite result ($SCOPE/$REQUIRED/$TEST)"; exit 1 ;;
          esac
