name: EAS Development & Preview

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: 'Build profile (production builds use the Release workflow)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.platform }})
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Require a development or preview profile
        shell: bash
        run: |
          case "$BUILD_PROFILE" in
            development|preview) ;;
            *)
              echo "::error::This workflow only builds development and preview profiles. For production, use Release (.github/workflows/release.yml), which verifies the release configuration and completed artifact."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
        working-directory: apps/mobile
        run: eas build --platform ios --profile "$BUILD_PROFILE" --non-interactive

      - name: Build Android
        if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' }}
        working-directory: apps/mobile
        run: eas build --platform android --profile "$BUILD_PROFILE" --non-interactive
