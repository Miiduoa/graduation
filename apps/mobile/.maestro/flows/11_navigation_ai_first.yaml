# 11_navigation_ai_first.yaml
# 4+1 AI-First：底部四 Tab、頭像抽屜、中央 AI 球
# 需在已通過 Onboarding 的情境下執行（或接在 01 之後）。

appId: com.campus.app
name: Navigation AI-First Shell
tags:
  - smoke
  - navigation
  - ai

---

- launchApp

# 主儀表／今天
- extendedWaitUntil:
    visible: '公告'
    timeout: 12000


# 底部情境 Tab（標籤為 permissions.ts 的 UNIFIED_TABS.label）
- assertVisible:
    text: '今天'
- assertVisible:
    text: '學習'
- assertVisible:
    text: '校園'
- assertVisible:
    text: '訊息'

- takeScreenshot: ai_first_tabs

# Maestro id 對應 RN testID
- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 5000


- takeScreenshot: header_drawer_open

# 關閉抽屜（點遮罩）
- tapOn:
    text: '關閉抽屜'
    optional: true

- tapOn:
    id: 'ai-floating-ball'
    optional: true

- extendedWaitUntil:
    visible: 'AI 校園助理'
    timeout: 8000
    optional: true

- takeScreenshot: ai_overlay_optional

