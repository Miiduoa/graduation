appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: school-picker-open
    direction: DOWN
    centerElement: false
    timeout: 30000
- tapOn:
    id: school-picker-open
- extendedWaitUntil:
    visible:
      id: school-picker-search
    timeout: 15000
- tapOn:
    id: school-picker-search
- inputText: 'PU'
- assertVisible:
    id: school-picker-search
    text: '^PU$'
- extendedWaitUntil:
    visible:
      id: school-picker-option-pu
    timeout: 20000
- tapOn:
    id: school-picker-option-pu
- extendedWaitUntil:
    visible: '目前瀏覽靜宜大學，選擇其他學校'
    timeout: 15000
