appId: ${APP_ID}
name: Real emulator authentication and sign-out boundary
tags: [smoke, auth]
---
- runFlow: ../helpers/open-emulator-login.yaml
- inputText: 'incorrect-emulator-fixture-password'
# Same overlay as the seeded sign-in: submit by tapping the visible control
# instead of Maestro hideKeyboard, which iOS password keyboards do not expose.
- tapOn:
    id: maestro-sign-in
    enabled: true
- extendedWaitUntil:
    visible:
      id: maestro-login-error
    timeout: 20000
- assertNotVisible:
    id: tab-Today
# Recover from the rejected password in the same visible form. Relaunching
# here depends on the test-only trigger being recreated after a failed login
# and never exercises the user's actual retry path.
- assertVisible:
    id: maestro-emulator-login
- tapOn:
    id: maestro-password
- clearText
- inputText: 'campus-test-1234' # gitleaks:allow public loopback emulator fixture
- assertVisible:
    id: maestro-password
    text: '^campus-test-1234$'
- tapOn:
    id: maestro-sign-in
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: tab-Today
    timeout: 40000
- assertNotVisible:
    id: login-landing
- assertNotVisible:
    id: maestro-emulator-login
- assertNotVisible:
    id: maestro-login-error
- extendedWaitUntil:
    visible:
      id: student-today
    timeout: 30000
- tapOn:
    id: tab-我的
- extendedWaitUntil:
    visible: '目前登入帳號'
    timeout: 15000
- assertVisible: '測試學生甲'
- scrollUntilVisible:
    element:
      text: '^個人資料$'
    direction: DOWN
    timeout: 20000
- tapOn: '個人資料'
- extendedWaitUntil:
    visible: '基本資訊'
    timeout: 15000
- assertVisible: '測試學生甲'
- takeScreenshot: authenticated_seeded_profile
- tapOn: '返回'
- scrollUntilVisible:
    element:
      text: '^登出學校帳號$'
    direction: DOWN
    timeout: 20000
- tapOn: '^登出學校帳號$'
- extendedWaitUntil:
    visible: '確定要登出學校帳號嗎？Google 帳號會保留登入。'
    timeout: 10000
- tapOn:
    text: '^確定登出$'
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 30000
- assertNotVisible:
    id: tab-Today
# A stale school deep link after logout must not restore private navigation.
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://groups
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
- assertNotVisible:
    id: tab-Today
- assertNotVisible: '群組加入碼'
- takeScreenshot: signed_out_private_route_blocked
