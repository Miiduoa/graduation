name: Transit production readiness

on:
  workflow_dispatch:
  push:
    branches: [chore/transit-production-readiness]
    paths: [.github/workflows/transit-readiness.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: transit-readiness-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - name: Read source state and production HTTP responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const origin = 'https://nuni.tw';
          const base = 'https://api.github.com/repos/Miiduoa/graduation';
          async function request(url, options = {}) {
            try {
              const response = await fetch(url, {redirect:'error', signal:AbortSignal.timeout(15000), ...options});
              const text = await response.text();
              let body = null;
              if (response.headers.get('content-type')?.includes('application/json')) {
                try { body = JSON.parse(text); } catch {}
              }
              return {code:response.status, type:response.headers.get('content-type'), policy:response.headers.get('permissions-policy'), body, text};
            } catch { return {code:null, body:null, text:'', error:'request-failed'}; }
          }
          const github = (path) => request(base + path, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json'}});
          const main = await github('/branches/main');
          const sha = main.body?.commit?.sha;
          const pr = await github('/pulls/33');
          const source = {checkedAt:new Date().toISOString(), mainRevision:sha ?? null, pr33:{state:pr.body?.state, merged:pr.body?.merged, mergedAt:pr.body?.merged_at, head:pr.body?.head?.sha}, files:{}};
          if (/^[a-f0-9]{40}$/.test(sha ?? '')) {
            for (const path of ['apps/web/src/app/api/transit/route.ts','apps/web/src/components/TransitExplorer.tsx','docs/TRANSIT.md']) {
              const r = await github(`/contents/${path}?ref=${sha}`);
              source.files[path] = {httpStatus:r.code, present:r.code === 200 ? true : r.code === 404 ? false : null};
            }
            const runs = await github(`/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=5`);
            const latest = runs.body?.workflow_runs?.filter(r => r.head_sha === sha).sort((a,b) => b.id-a.id)[0];
            source.mainCi = latest ? {id:latest.id,status:latest.status,conclusion:latest.conclusion,url:latest.html_url} : null;
          }
          const jobs = await github('/actions/runs/38231302159/jobs?per_page=100');
          source.originalPrCiJobs = jobs.body?.jobs?.map(j => ({name:j.name,status:j.status,conclusion:j.conclusion})) ?? null;
          const health = await request(origin + '/health/ready');
          const page = await request(origin + '/bus');
          const report = {checkedAt:new Date().toISOString(), origin, health:{httpStatus:health.code,contentType:health.type,service:health.body?.service,status:health.body?.status,revision:health.body?.revision ?? null}, page:{httpStatus:page.code,permissionsPolicy:page.policy ?? null,newExplorerPresent:['學校站牌','找我附近','搜尋站名','常用站牌'].every(t => page.text.includes(t))}, queries:[]};
          for (const query of [{action:'campus',schoolId:'pu'},{action:'search',city:'Taichung',text:'靜宜大學'}]) {
            const r = await request(origin + '/api/transit', {method:'POST', headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify(query)});
            const stops = r.body?.status === 'ready' && r.body?.kind === 'stops' && Array.isArray(r.body.stops) ? r.body.stops : null;
            report.queries.push({query,httpStatus:r.code,contentType:r.type,status:r.body?.status ?? null,reason:r.body?.reason ?? null,stationCount:stops?.length ?? null,stops:stops?.slice(0,16).map(s => ({id:s.id,name:s.name,city:s.city,lat:s.lat,lon:s.lon})) ?? []});
          }
          report.arrivals = {checked:false,reason:'no-verified-station'};
          const stop = report.queries.flatMap(q => q.stops).find(s => /^[A-Za-z0-9_-]{1,80}$/.test(s.id ?? '') && s.city === 'Taichung');
          if (stop) {
            const r = await request(origin + '/api/transit', {method:'POST',headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify({action:'arrivals',city:stop.city,stopId:stop.id})});
            const rows = r.body?.status === 'ready' && r.body?.kind === 'arrivals' && Array.isArray(r.body.arrivals) ? r.body.arrivals : null;
            report.arrivals = {checked:true,stopId:stop.id,httpStatus:r.code,status:r.body?.status ?? null,reason:r.body?.reason ?? null,count:rows?.length ?? null,rows:rows?.slice(0,20).map(a => ({route:a.route,direction:a.direction,destination:a.destination,status:a.status,seconds:a.seconds,updatedAt:a.updatedAt,sourceAgeSeconds:Number.isFinite(Date.parse(a.updatedAt)) ? Math.round((Date.now()-Date.parse(a.updatedAt))/1000) : null})) ?? []};
          }
          report.physicalDeviceVerified = false;
          report.deploymentPerformed = false;
          await fs.writeFile('evidence/source.json',JSON.stringify(source,null,2));
          await fs.writeFile('evidence/public.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({mainRevision:sha,mainCi:source.mainCi,newExplorerPresent:report.page.newExplorerPresent,transit:report.queries.map(q => ({action:q.query.action,httpStatus:q.httpStatus,reason:q.reason,stationCount:q.stationCount}))}));
          NODE
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Inspect deployment credential and Fly secret metadata without exposing values
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const keys = ['TDX_CLIENT_ID','TDX_CLIENT_SECRET'];
          const report = {checkedAt:new Date().toISOString(),app:'nuni-web',repositoryCredentials:{FLY_NUNI_WEB_DEPLOY_TOKEN:Boolean(process.env.FLY_API_TOKEN),...Object.fromEntries(keys.map(k => [k,Boolean(process.env[k])]))},flySecrets:{checked:false,reason:'deployment-credential-unavailable'},machines:{checked:false},writesPerformed:false};
          if (process.env.FLY_API_TOKEN) {
            try {
              const parsed = JSON.parse(execFileSync('flyctl',['secrets','list','--app','nuni-web','--json'],{encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']}));
              const rows = Array.isArray(parsed) ? parsed : parsed.secrets;
              if (!Array.isArray(rows)) throw new Error('unexpected-shape');
              report.flySecrets = {checked:true,keys:Object.fromEntries(keys.map(k => {const row = rows.find(s => (s.Name ?? s.name) === k); const state = row?.Status ?? row?.status ?? row?.DeploymentStatus ?? row?.deployment_status; return [k,{present:Boolean(row),deploymentState:['Deployed','Staged','Partial','Unknown','deployed','staged','partial','unknown'].includes(state) ? state : null}];}))};
            } catch { report.flySecrets = {checked:false,reason:'authorization-cli-or-response-failure'}; }
            try {
              const rows = JSON.parse(execFileSync('flyctl',['machine','list','--app','nuni-web','--json'],{encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']}));
              if (!Array.isArray(rows)) throw new Error('unexpected-shape');
              report.machines = {checked:true,rows:rows.map(r => ({id:r.id,region:r.region,state:r.state,image:r.image_ref?.digest ?? null,tdxPlainEnvironmentPresent:Object.fromEntries(keys.map(k => [k,Object.hasOwn(r.config?.env ?? {},k)]))}))};
            } catch { report.machines = {checked:false,reason:'authorization-cli-or-response-failure'}; }
          }
          await fs.writeFile('evidence/platform.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          NODE
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/transit-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/transit-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture production desktop and mobile-browser evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/transit-browser/node_modules/playwright/index.mjs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          const {chromium} = await import(pathToFileURL(process.env.PLAYWRIGHT_MODULE).href);
          const browser = await chromium.launch();
          const report = {checkedAt:new Date().toISOString(),origin:'https://nuni.tw',browser:'Chromium',physicalDevice:false,mockedTransit:false,views:[]};
          try {
            for (const [name,viewport,mobile] of [['desktop',{width:1440,height:1000},false],['mobile',{width:390,height:844},true]]) {
              const context = await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,locale:'zh-TW',timezoneId:'Asia/Taipei'});
              const page = await context.newPage();
              let errorCount = 0;
              page.on('pageerror',() => errorCount++);
              const view = {name,viewport,emulatedMobile:mobile};
              try {
                const response = await page.goto(report.origin+'/bus',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(6000);
                view.httpStatus = response?.status() ?? null;
                view.finalUrl = page.url();
                view.layout = await page.evaluate(() => ({innerWidth,documentWidth:document.documentElement.scrollWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1}));
                view.visibleText = (await page.locator('body').innerText()).slice(-7000);
                await page.screenshot({path:`evidence/${name}-bus.png`,fullPage:true});
                const nearby = page.getByRole('button',{name:'找我附近',exact:true});
                view.locationControlsPresent = await nearby.count() === 1;
                view.locationDenied = {checked:false,reason:'nearby-control-not-present'};
                if (view.locationControlsPresent) {
                  await context.grantPermissions([],{origin:report.origin});
                  const state = await page.evaluate(async () => (await navigator.permissions.query({name:'geolocation'})).state);
                  if (state === 'denied') {
                    await nearby.click();
                    await page.waitForTimeout(1000);
                    const text = await page.locator('body').innerText();
                    view.locationDenied = {checked:true,permission:state,messageVisible:/定位|位置/.test(text),visibleText:text.slice(-5000)};
                    await page.screenshot({path:`evidence/${name}-location-denied.png`,fullPage:true});
                  } else view.locationDenied = {checked:false,reason:'permission-not-denied',permission:state};
                }
                view.locationAllowed = {checked:false,reason:'physical-location-validation-not-performed'};
                await context.setOffline(true);
                await page.waitForTimeout(2000);
                view.offline = {checked:true,networkDisabled:true,visibleText:(await page.locator('body').innerText()).slice(-5000)};
                await page.screenshot({path:`evidence/${name}-offline.png`,fullPage:true});
                await context.setOffline(false);
                await page.reload({waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                view.reconnect = {checked:true,visibleText:(await page.locator('body').innerText()).slice(-5000)};
                view.staleArrival = {checked:false,reason:'requires-verified-live-arrival-and-90-second-observation'};
                view.pageErrorCount = errorCount;
              } catch { view.error = 'browser-check-failed'; }
              report.views.push(view);
              await context.close();
            }
          } finally { await browser.close(); }
          await fs.writeFile('evidence/browser.json',JSON.stringify(report,null,2));
          NODE
      - name: Summarize evidence without implying deployment or service readiness
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const read = async p => {try {return JSON.parse(await fs.readFile(p,'utf8'));} catch {return null;}};
          const pub = await read('evidence/public.json');
          const platform = await read('evidence/platform.json');
          const browser = await read('evidence/browser.json');
          const lines = ['## 公車正式環境唯讀驗收','','本流程沒有部署、設定金鑰、重啟或新增機器。工作流程成功只表示完成蒐證，不代表公車接通。','',`公車新版畫面：${pub?.page?.newExplorerPresent ?? 'unknown'}`,`公開查詢：${JSON.stringify(pub?.queries?.map(q => ({action:q.query.action,http:q.httpStatus,reason:q.reason,count:q.stationCount})) ?? null)}`,`GitHub Secret 可用性：${JSON.stringify(platform?.repositoryCredentials ?? null)}`,`Fly Secret metadata：${JSON.stringify(platform?.flySecrets ?? null)}`,`瀏覽器證據：${browser?.views?.length ?? 0} 個尺寸；手機是瀏覽器模擬，不是實機。`,'','請分別查看 source.json、public.json、platform.json、browser.json 和原始截圖。'];
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transit-production-readiness-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
