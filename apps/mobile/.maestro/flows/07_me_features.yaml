# 07_me_features.yaml
# 從已登入學生的頭像選單驗證名片與成就紀錄。

appId: ${APP_ID}
name: Me Features (Header Drawer)
tags:
  - smoke
  - me

---

- runFlow: ../helpers/sign-in-student.yaml
- tapOn:
    id: tab-校園

- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible:
      id: 'header-avatar-button'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 1500

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'header-avatar-button'
      - waitForAnimationToEnd:
          timeout: 1500
      - extendedWaitUntil:
          visible:
            id: header-drawer-panel
          timeout: 8000
- assertVisible:
    id: header-drawer-panel
- assertVisible:
    id: header-drawer-identity
- assertVisible:
    id: drawer-section-個人
- assertVisible: '個人資料'

- takeScreenshot: drawer_open

- scrollUntilVisible:
    element:
      text: '我的 QR Code'
    direction: DOWN
    timeout: 20000

- tapOn:
    text: '我的 QR Code'

- extendedWaitUntil:
    visible: 'QR 碼'
    timeout: 8000

- takeScreenshot: qr_code_screen

- tapOn: '返回'

- tapOn:
    id: tab-校園

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'header-avatar-button'
      - waitForAnimationToEnd:
          timeout: 1500
      - extendedWaitUntil:
          visible:
            id: header-drawer-panel
          timeout: 8000
- assertVisible:
    id: header-drawer-panel
- assertVisible:
    id: header-drawer-identity

- scrollUntilVisible:
    element:
      text: '成就與積分'
    direction: DOWN
    timeout: 20000

- tapOn:
    text: '成就與積分'

- extendedWaitUntil:
    visible: '成就紀錄'
    timeout: 8000

- takeScreenshot: achievements_screen

- tapOn: '返回'
