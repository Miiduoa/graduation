name: Campus mobile historical title search

on:
  push:
    branches: ['feat/social-feed-older-search-20261106']
    paths:
      - 'apps/mobile/src/screens/CommunityScreen.tsx'
      - 'apps/mobile/src/screens/social/TitleHistorySearch.tsx'
      - 'apps/mobile/src/services/titleSearch.ts'
      - 'apps/mobile/src/services/feed.ts'
      - 'apps/mobile/src/screens/social/PostDetailScreen.tsx'
      - 'apps/mobile/src/__tests__/PostDetailRecovery.test.tsx'
      - 'apps/mobile/src/__tests__/TitleHistorySearch.test.tsx'
      - 'apps/mobile/integration/title-history/**'
      - 'apps/mobile/jest.title-history-integration.config.cjs'
      - 'packages/shared/src/communityTitleSearch.ts'
      - 'backend/firestore/firestore.rules'
      - 'scripts/qa/mobile-title-history-emulator.mjs'
      - '.github/workflows/campus-mobile-title-history.yml'
  pull_request:
    branches: [main, 'feat/story-media-in-place-retry-20261106']
    paths:
      - 'apps/mobile/src/screens/CommunityScreen.tsx'
      - 'apps/mobile/src/screens/social/TitleHistorySearch.tsx'
      - 'apps/mobile/src/services/titleSearch.ts'
      - 'apps/mobile/src/services/feed.ts'
      - 'apps/mobile/src/screens/social/PostDetailScreen.tsx'
      - 'apps/mobile/src/__tests__/PostDetailRecovery.test.tsx'
      - 'apps/mobile/src/__tests__/TitleHistorySearch.test.tsx'
      - 'apps/mobile/integration/title-history/**'
      - 'apps/mobile/jest.title-history-integration.config.cjs'
      - 'packages/shared/src/communityTitleSearch.ts'
      - 'backend/firestore/firestore.rules'
      - 'scripts/qa/mobile-title-history-emulator.mjs'
      - '.github/workflows/campus-mobile-title-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-title-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-history:
    name: Native title search and rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install from lockfile
        id: install
        run: pnpm install --frozen-lockfile
      - name: Native history interactions and existing feed regression
        run: |
          mkdir -p artifacts/mobile-title-history artifacts/mobile-title-integration
          pnpm --filter mobile exec jest src/__tests__/PostDetailRecovery.test.tsx src/__tests__/TitleHistorySearch.test.tsx src/__tests__/SocialBrowsingScreens.test.tsx src/__tests__/feedPages.test.ts src/__tests__/feedDiscoveryModel.test.ts --runInBand --json --outputFile=../../artifacts/mobile-title-history/jest.json
      - name: Native service against real SDK and repository rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GCLOUD_PROJECT: demo-campus-native-title
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec firebase emulators:exec --project demo-campus-native-title --only firestore "node scripts/qa/mobile-title-history-emulator.mjs"
      - name: Native component through real SDK and repository rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GCLOUD_PROJECT: demo-campus-native-title-ui
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec firebase emulators:exec --project demo-campus-native-title-ui --only firestore "pnpm --filter mobile exec jest --config jest.title-history-integration.config.cjs --runInBand --json --outputFile=../../artifacts/mobile-title-integration/jest.json"
      - name: Mobile typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter mobile typecheck
      - name: Native search focused lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter mobile exec eslint src/screens/social/TitleHistorySearch.tsx src/services/titleSearch.ts
      - name: Preserve exact source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-title-history-${{ github.run_id }}
          path: |
            artifacts/mobile-title-history/
            artifacts/mobile-title-integration/
          # The test copies a fixed source allowlist, including its .github workflow.
          # Only these generated evidence directories are uploaded, never the workspace.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
