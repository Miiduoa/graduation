# 10_full_user_journey.yaml
# 迴歸：不使用 clearState（Expo dev client 需保留 Metro bundle URL）

appId: ${APP_ID}
name: Full User Journey
tags:
  - regression
  - journey

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

# 公告
- scrollUntilVisible:
    element:
      id: 'e2e-open-announcements'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-open-announcements'

- extendedWaitUntil:
    visible: '搜尋公告（標題/內文/來源）'
    timeout: 15000

- takeScreenshot: journey_01_announcements

- tapOn:
    index: 0
    optional: true

- takeScreenshot: journey_02_announcement_detail_optional

- back

# 活動
- scrollUntilVisible:
    element:
      id: 'e2e-open-events'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-open-events'

- extendedWaitUntil:
    visible: '活動'
    timeout: 15000
    optional: true

- takeScreenshot: journey_03_events

- back

# 校園／地圖
- tapOn:
    id: 'tab-校園'

- scrollUntilVisible:
    element:
      id: 'e2e-campus-open-map'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-campus-open-map'

- takeScreenshot: journey_05_map

- tapOn:
    text: '餐廳'
    optional: true

- takeScreenshot: journey_06_map_cafeteria_filter_optional

- back

# 餐廳
- scrollUntilVisible:
    element:
      id: 'e2e-campus-open-cafeteria'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-campus-open-cafeteria'

- takeScreenshot: journey_07_cafeteria

- back

# 個人抽屜
- tapOn:
    id: 'tab-Today'

- waitForAnimationToEnd:
    timeout: 2000

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 15000

- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- scrollUntilVisible:
    element:
      text: '一般設定'
    direction: DOWN
    timeout: 20000
    optional: true

- tapOn:
    text: '一般設定'
    optional: true

- takeScreenshot: journey_14_settings_optional

- back
