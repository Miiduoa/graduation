# 03_announcements.yaml
# 從 Today 儀表快速入口進入公告總覽

appId: ${APP_ID}
name: Announcements Flow
tags:
  - smoke
  - announcements

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- scrollUntilVisible:
    element:
      id: 'e2e-open-announcements'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-open-announcements'

- extendedWaitUntil:
    visible: '搜尋公告（標題/內文/來源）'
    timeout: 15000

- takeScreenshot: announcements_list

- tapOn:
    text: '搜尋公告（標題/內文/來源）'

- inputText: '選課'

- extendedWaitUntil:
    visible: '選課'
    timeout: 8000
    optional: true

- takeScreenshot: announcements_search_result

# 點第一則列表項（標題列之下）
- tapOn:
    index: 1
    optional: true

- extendedWaitUntil:
    visible: '收藏'
    timeout: 8000
    optional: true

- takeScreenshot: announcement_detail_optional

- back
