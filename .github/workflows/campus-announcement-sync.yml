# 晉瑋已核准：每天兩次同步 pu、ncku、ntpu 公告（台北 07:00、11:30）；只寫 schools/{schoolId}/announcements 與 announcement-sources。
# 寫入學校以 CAMPUS_ANNOUNCEMENT_SYNC_SCHOOLS 為準，未設時用 pu,ncku,ntpu；不要一次掃其他學校。
# 要停：拿掉 schedule，或刪掉 production 環境的 CAMPUS_ANNOUNCEMENT_SYNC_ENABLED。
name: Campus announcement sync

on:
  schedule:
    - cron: '0 23 * * *' # 07:00 Taipei，早上第一堂前
    - cron: '30 3 * * *' # 11:30 Taipei，中午尖峰前
  workflow_dispatch:
    inputs:
      school:
        description: 'schoolId to scrape, for example pu'
        required: true
        default: 'pu'
        type: string
      write:
        description: 'Write to Firestore. Keep false unless production write is approved.'
        required: false
        default: false
        type: boolean
      probe:
        description: 'Also dry-run NCKU and NTPU sources without writing.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: campus-announcement-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Preview or sync campus announcements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SCHOOL_ID: ${{ inputs.school || 'pu' }}
      WRITE: ${{ github.event_name == 'schedule' || inputs.write == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter functions...

      - name: Dry-run
        if: ${{ env.WRITE != 'true' }}
        run: pnpm --filter functions sync:announcements --school "$SCHOOL_ID"

      - name: Sync to Firestore
        if: ${{ env.WRITE == 'true' }}
        env:
          CAMPUS_ANNOUNCEMENT_SYNC_ENABLED: ${{ secrets.CAMPUS_ANNOUNCEMENT_SYNC_ENABLED }}
          CAMPUS_ANNOUNCEMENT_SYNC_SCHOOLS: ${{ secrets.CAMPUS_ANNOUNCEMENT_SYNC_SCHOOLS }}
          ANNOUNCEMENT_SYNC_SA_JSON: ${{ secrets.ANNOUNCEMENT_SYNC_SA_JSON }}
        run: |
          if [ -z "$ANNOUNCEMENT_SYNC_SA_JSON" ]; then
            echo "::error::缺少 ANNOUNCEMENT_SYNC_SA_JSON"
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/announcement-sync-sa.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$ANNOUNCEMENT_SYNC_SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          SCHOOLS="${CAMPUS_ANNOUNCEMENT_SYNC_SCHOOLS:-}"
          if [ -z "$SCHOOLS" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              SCHOOLS="pu,ncku,ntpu"
            else
              SCHOOLS="$SCHOOL_ID"
            fi
          fi
          APPROVED=" pu ncku ntpu "
          IFS=', ' read -ra IDS <<< "$SCHOOLS"
          for id in "${IDS[@]}"; do
            [ -z "$id" ] && continue
            case "$APPROVED" in
              *" $id "*) ;;
              *) echo "::error::未核准寫入 $id"; exit 1 ;;
            esac
            pnpm --filter functions sync:announcements --school "$id" --write
          done

  probe:
    name: Probe NCKU and NTPU sources
    if: ${{ github.event_name == 'schedule' || inputs.probe != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter functions...

      - name: Dry-run NCKU and NTPU without writing
        run: pnpm --filter functions sync:announcements:probe -- --schools ncku,ntpu
