name: Campus historical title search

on:
  push:
    branches: ['feat/social-feed-older-search-20261106']
    paths:
      - 'apps/web/src/lib/community/titleSearch*'
      - 'apps/web/src/app/community/_components/TitleHistorySearch*'
      - 'apps/web/src/app/community/history/**'
      - 'apps/web/src/app/community/page.tsx'
      - 'backend/firestore/firestore.rules'
      - 'scripts/qa/social-title-history-browser.mjs'
      - '.github/workflows/campus-title-history.yml'
  pull_request:
    branches: [main, 'feat/story-media-in-place-retry-20261106']
    paths:
      - 'apps/web/src/lib/community/titleSearch*'
      - 'apps/web/src/app/community/_components/TitleHistorySearch*'
      - 'apps/web/src/app/community/history/**'
      - 'apps/web/src/app/community/page.tsx'
      - 'backend/firestore/firestore.rules'
      - 'scripts/qa/social-title-history-browser.mjs'
      - '.github/workflows/campus-title-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: title-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Title search service and student interaction
        run: pnpm --filter web exec vitest run src/lib/community/titleSearch.test.ts src/app/community/_components/TitleHistorySearch.test.tsx
      - name: Historical search with real SDK and repository rules
        env:
          REQUIRE_HISTORY_EMULATOR: '1'
        run: pnpm exec firebase emulators:exec --project demo-campus-title-search --only firestore "pnpm --filter web exec vitest run src/lib/community/titleSearch.emulator.test.ts"
      - name: Complete Web typecheck
        run: pnpm --filter web typecheck
      - name: Focused ESLint
        run: pnpm --filter web exec eslint src/lib/community/titleSearch.ts src/lib/community/titleSearch.test.ts src/lib/community/titleSearch.emulator.test.ts src/app/community/_components/TitleHistorySearch.tsx src/app/community/_components/TitleHistorySearch.test.tsx src/app/community/history/page.tsx src/app/community/page.tsx
      - name: Compile the actual Next routes without deployment
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter web build
  title-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Browser and fonts
        run: |
          command -v google-chrome
          # The 1.7 MB WenQuanYi font keeps Chinese screenshots legible.
          # Previous hosted jobs timed out on a full apt mirror refresh before Chrome.
          # Prefer preinstalled fonts or the runner's existing apt package index.
          if ! fc-list :lang=zh-tw family | grep -Fq 'WenQuanYi Micro Hei'; then
            if ! sudo timeout --kill-after=5s 100 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-microhei; then
              sudo timeout --kill-after=5s 60 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
              sudo timeout --kill-after=5s 100 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-wqy-microhei
            fi
          fi
          fc-cache -f
          fc-list :lang=zh-tw family | grep -F 'WenQuanYi Micro Hei'
      - name: Real title search component to SDK and isolated rules
        env:
          GCLOUD_PROJECT: demo-campus-title-search
          TZ: Asia/Taipei
        run: pnpm exec firebase emulators:exec --project demo-campus-title-search --only firestore "node scripts/qa/social-title-history-browser.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-title-history-${{ github.run_id }}
          path: artifacts/campus-title-history/
          retention-days: 14
          if-no-files-found: warn
