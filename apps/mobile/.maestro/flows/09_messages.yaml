# 09_messages.yaml
# 訊息 Tab 收件匣 → 課程群組

appId: ${APP_ID}
name: Messages & Groups Flow
tags:
  - smoke
  - messages
  - groups

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    id: 'tab-訊息'

- extendedWaitUntil:
    visible: '任務'
    timeout: 15000

- takeScreenshot: messages_inbox

- tapOn:
    id: 'e2e-open-groups'

- extendedWaitUntil:
    visible: '加入碼'
    timeout: 30000

- takeScreenshot: groups_screen

- back
