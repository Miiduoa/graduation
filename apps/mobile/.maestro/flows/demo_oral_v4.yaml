appId: ${APP_ID}
name: Public oral-exam workspace and isolated role interactions
tags: [demo, oral, regression]
---
# The old __DEV__ cockpit/role-switch no longer exists in a Release build.
# Exercise its supported public replacement; this does not establish school auth.
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://demo/oral-exam
- extendedWaitUntil:
    visible:
      id: oral-exam-demo
    timeout: 20000
- assertNotVisible:
    id: tab-Today
- scrollUntilVisible:
    element:
      id: oral-exam-submit-hw
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oral-exam-submit-hw
- scrollUntilVisible:
    element:
      id: oral-exam-check-in
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oral-exam-check-in
- tapOn:
    id: oral-exam-request-leave
- scrollUntilVisible:
    element:
      id: oral-exam-leave-status
    direction: DOWN
    timeout: 20000
- assertVisible: '.*待審.*'
- scrollUntilVisible:
    element:
      id: oral-exam-role-teacher
    direction: UP
    timeout: 20000
- tapOn:
    id: oral-exam-role-teacher
- scrollUntilVisible:
    element:
      id: oral-exam-publish-grade
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oral-exam-publish-grade
- scrollUntilVisible:
    element:
      id: oral-exam-approve-leave
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oral-exam-approve-leave
    enabled: true
- assertVisible: '.*已核准.*'
- scrollUntilVisible:
    element:
      id: oral-exam-role-merchant
    direction: UP
    timeout: 20000
- tapOn:
    id: oral-exam-role-merchant
- scrollUntilVisible:
    element:
      id: oral-exam-ready-order
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oral-exam-ready-order
- scrollUntilVisible:
    element:
      id: oral-exam-role-student
    direction: UP
    timeout: 20000
- tapOn:
    id: oral-exam-role-student
- scrollUntilVisible:
    element:
      text: '.*已繳交.*'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '.*已簽到.*'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: oral-exam-leave-status
    direction: DOWN
    timeout: 20000
- assertVisible: '.*已核准.*'
- scrollUntilVisible:
    element:
      text: '.*訂單可取餐.*'
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: tab-Today
- takeScreenshot: oral_exam_shared_role_state
