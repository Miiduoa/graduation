name: Assistant Plan Revision Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/features/nuni/Assistant.tsx'
      - 'apps/web/src/features/nuni/AssistantPlanRevisionFlow.test.tsx'
      - 'apps/web/src/features/nuni/AssistantProtectedPlanFlow.test.tsx'
      - 'apps/web/src/lib/nuni/assistantV2/**'
      - 'apps/web/src/features/nuni/assistant/**'
      - 'apps/web/src/lib/assistantCalendarExecution*'
      - 'apps/web/src/lib/assistantPlanProtection*'
      - 'apps/web/src/lib/assistantExecutionJournal*'
      - 'apps/web/src/lib/personalImports*'
      - 'apps/web/src/app/globals.css'
      - 'packages/shared/src/assistantExecution*'
      - 'packages/shared/src/imports/**'
      - 'scripts/qa/assistant-plan-revision/**'
      - 'apps/web/tsconfig.json'
      - 'apps/web/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/assistant-plan-revision-browser.yml'
  push:
    branches: [feat/agent-confirmation-workflow-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-plan-revision-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Revision preview and per-card confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Bundle actual Assistant with fixed fake API
        run: node scripts/qa/assistant-plan-revision/build.mjs
      - name: Check revision, confirmation and controlled recovery
        run: python scripts/qa/assistant-plan-revision/check.py
      - name: Upload screenshots and request ledgers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assistant-plan-revision-browser
          path: artifacts/assistant-plan-revision
          retention-days: 7
