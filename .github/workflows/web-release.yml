name: Web release checks (free-only)

# Production deployment is intentionally disabled under the zero-spend policy.
# Running this workflow never calls Fly, builds/pushes an image, or uses a deploy token.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/web/release-check*'
      - '.github/workflows/web-release.yml'
      - 'docs/FREE_TIER.md'
  push:
    branches: [main]
    paths:
      - 'deploy/web/release-check*'
      - '.github/workflows/web-release.yml'
      - 'docs/FREE_TIER.md'

permissions:
  contents: read

jobs:
  guards:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate release-check utilities without live network requests
        run: node --test deploy/web/release-check.test.mjs
      - name: Record that no deployment was performed
        run: |
          printf '%s\n' '## Free-only mode' '' 'Checks only. No Fly deployment, no registry push, and no new cloud resources.' 'This does not stop existing Fly machines or cancel their billing.' >> "$GITHUB_STEP_SUMMARY"
