name: Timetable Browser
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/components/timetable/**'
      - 'apps/web/src/components/ui/Modal*'
      - 'apps/web/src/components/ui/modalSession*'
      - 'apps/web/src/app/page.tsx'
      - 'apps/web/src/app/home.module.css'
      - 'apps/web/src/app/globals.css'
      - 'apps/web/src/app/layout.tsx'
      - 'apps/web/src/app/life/**'
      - 'apps/web/src/app/settings/**'
      - 'apps/web/src/components/today/**'
      - 'apps/web/src/components/AppearancePreferences*'
      - 'apps/web/src/components/AppHeader*'
      - 'apps/web/src/components/CampusIcon*'
      - 'apps/web/src/components/CampusWeek*'
      - 'apps/web/src/components/CampusServiceMenu*'
      - 'apps/web/src/components/SchoolSelector*'
      - 'apps/web/src/components/transit.module.css'
      - 'apps/web/src/lib/webPreferences*'
      - 'apps/web/src/lib/primaryNavigation*'
      - 'apps/web/src/lib/todayScreen*'
      - 'apps/web/src/lib/usePersonalTodayRecords*'
      - 'apps/web/public/offline.html'
      - 'scripts/timetable-browser-smoke.py'
      - 'scripts/campus-visual-smoke.py'
      - '.github/workflows/timetable-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timetable-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest-interactions:
    name: Guest timetable interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Build Web
        run: pnpm --filter web build
      - name: Exercise production guest timetable
        run: |
          mkdir -p artifacts/timetable-browser
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          if [ -d apps/web/public ]; then cp -R apps/web/public apps/web/.next/standalone/apps/web/public; fi
          HOSTNAME=127.0.0.1 PORT=3100 node apps/web/.next/standalone/apps/web/server.js > artifacts/timetable-browser/server.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          node --input-type=module - <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try { if ((await fetch('http://127.0.0.1:3100/timetable')).ok) { ready = true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Web server did not become ready');
          NODE
          python scripts/timetable-browser-smoke.py
          python scripts/campus-visual-smoke.py
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timetable-browser
          path: |
            artifacts/timetable-browser
            artifacts/campus-visual
          retention-days: 7
