# Target the local MLX path on a real macOS arm64 GitHub-hosted runner.
# No model weights or tokens are downloaded; this is not full training acceptance.
name: Local MLX Apple Silicon Compatibility

on:
  pull_request:
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/training/**'
      - 'backend/ai-server/tests/mlx_lora_compat_smoke.py'
      - '.github/workflows/mlx-arm64-compat.yml'
  push:
    branches: [main]
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/training/**'
      - 'backend/ai-server/tests/mlx_lora_compat_smoke.py'
      - '.github/workflows/mlx-arm64-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlx-apple-silicon:
    name: MLX tensor / LoRA CLI smoke on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native MLX and NumPy candidate versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.4' 'mlx-lm==0.32.2' 'python-dotenv>=1.2.2' 'PyYAML>=6.0'
          python -m pip check
      - name: Verify Apple Silicon tensor and Campus One LoRA CLI
        run: python tests/mlx_lora_compat_smoke.py
      - name: Acceptance boundary
        run: |
          echo '::notice::Validates tiny MLX tensor and argument/configuration paths only; actual model loads, adapter training, and existing data remain to be verified.'
