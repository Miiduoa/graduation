appId: ${APP_ID}
name: Authenticated settings, theme, accessibility and language
tags: [smoke, settings]
---
- runFlow: ../helpers/sign-in-student.yaml
- tapOn:
    id: tab-我的
# Target the actual accessible row rather than its grouped text label.
- scrollUntilVisible:
    element:
      id: me-open-settings
    direction: DOWN
    centerElement: false
    timeout: 20000
- assertVisible:
    id: me-open-settings
    enabled: true
- tapOn:
    id: me-open-settings
    enabled: true
- extendedWaitUntil:
    visible: '^設定
    timeout: 15000
- assertVisible: '測試學生甲'
- scrollUntilVisible:
    element:
      text: '^深色$'
    direction: DOWN
    timeout: 20000
- tapOn: '^深色$'
- assertVisible: '目前使用深色模式。'
- tapOn: '^淺色$'
- assertVisible: '目前使用淺色模式。'
- scrollUntilVisible:
    element:
      text: '無障礙設定'
    direction: DOWN
    timeout: 20000
- tapOn: '無障礙設定'
- extendedWaitUntil:
    visible: '閱讀與操作'
    timeout: 10000
- assertVisible: 'VoiceOver 螢幕閱讀器'
- takeScreenshot: accessibility_settings
- tapOn: '返回'
- scrollUntilVisible:
    element:
      text: '^介面語言$'
    direction: DOWN
    timeout: 20000
- tapOn: '^介面語言$'
- extendedWaitUntil:
    visible: 'English'
    timeout: 10000
- tapOn: 'English'
- takeScreenshot: settings_english
- tapOn: '繁體中文'
- tapOn: '返回'
- scrollUntilVisible:
    element:
      text: '匯出我的資料'
    direction: DOWN
    timeout: 20000
- tapOn: '匯出我的資料'
- extendedWaitUntil:
    visible: '選擇內容，將資料保存到自己的裝置。'
    timeout: 10000
- takeScreenshot: data_export

    timeout: 15000
