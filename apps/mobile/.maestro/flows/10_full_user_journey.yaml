appId: ${APP_ID}
name: Authenticated deep-link journey
tags: [regression, journey]
---
- runFlow: ../helpers/sign-in-student.yaml
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://announcements
- extendedWaitUntil:
    visible: '公開處室公告的摘要與原文連結。一般帳號即可查看。'
    timeout: 20000
- takeScreenshot: journey_announcements
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://events
- extendedWaitUntil:
    visible: '查看時間、地點與主辦單位資訊。'
    timeout: 20000
- takeScreenshot: journey_events
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://map
- extendedWaitUntil:
    visible: '找到校園地點，再安排怎麼過去。'
    timeout: 20000
- takeScreenshot: journey_map
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://cafeteria
- extendedWaitUntil:
    visible: '選店、看菜單，再決定吃什麼。'
    timeout: 20000
- takeScreenshot: journey_cafeteria
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://settings
- extendedWaitUntil:
    visible: '目前登入帳號'
    timeout: 20000
- assertVisible: '測試學生甲'
- takeScreenshot: journey_settings
