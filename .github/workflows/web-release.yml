name: Web release

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: 'Complete main commit SHA whose full CI has passed'
        required: true
        type: string
      confirm_app:
        description: 'Type nuni-web to confirm the existing production Web app'
        required: true
        type: string
      transit_profile:
        description: 'live-tdx requires live arrivals; static-catalog verifies free Taichung stations without TDX keys; official-links-only is for legacy releases'
        required: true
        type: choice
        default: live-tdx
        options:
          - live-tdx
          - static-catalog
          - official-links-only
      assignment_file_submit_enabled:
        description: 'Bake ASSIGNMENT_FILE_SUBMIT_ENABLED into the Web image so /classroom gets camera=(self). Default false; repo variable ASSIGNMENT_FILE_SUBMIT_ENABLED=true also enables it.'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
  pull_request:
    paths:
      - 'deploy/web/release-check*'
      - 'deploy/web/transit-release-gate*'
      - 'deploy/web/runtime-security-check*'
      - '.github/workflows/web-release.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/web/release-check*'
      - 'deploy/web/transit-release-gate*'
      - 'deploy/web/runtime-security-check*'
      - '.github/workflows/web-release.yml'

permissions:
  contents: read

jobs:
  reject-non-main:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless this is main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::正式環境（production）的 Web 發布只能從 main 觸發。目前 ref 是 ${{ github.ref }}。"
            exit 1
          fi

  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - run: node --test deploy/web/release-check.test.mjs deploy/web/transit-release-gate.test.mjs deploy/web/release-safety.test.mjs deploy/web/runtime-security-check.test.cjs

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: nuni-web-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_revision }}
      CONFIRM_APP: ${{ inputs.confirm_app }}
      TRANSIT_RELEASE_PROFILE: ${{ inputs.transit_profile }}
      CAMPUS_RELEASE_SHA: ${{ inputs.expected_revision }}
      NEXT_PUBLIC_SITE_URL: https://nuni.tw
      NEXT_PUBLIC_FUNCTIONS_BASE_URL: ${{ vars.NEXT_PUBLIC_FUNCTIONS_BASE_URL }}
      ASSIGNMENT_FILE_SUBMIT_ENABLED: ${{ inputs.assignment_file_submit_enabled == 'true' && 'true' || vars.ASSIGNMENT_FILE_SUBMIT_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - name: Require exact main revision and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/web/release-check.mjs gate
      - name: Validate approved Firebase public browser configuration
        run: node deploy/web/release-check.mjs firebase
      - name: Require an app-scoped deployment credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo '::error::Missing FLY_NUNI_WEB_DEPLOY_TOKEN; no deployment performed.'
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Record existing machines and immutable rollback image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app nuni-web --json > "$RUNNER_TEMP/campus-web-machines-before.json"
          node deploy/web/release-check.mjs snapshot "$RUNNER_TEMP/campus-web-machines-before.json" release-evidence/before.json
          rm -f "$RUNNER_TEMP/campus-web-machines-before.json"
          flyctl auth docker
      - name: Verify selected transit profile inside every existing Web machine before building
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: node deploy/web/transit-release-gate.mjs fly release-evidence/before.json
      - name: Build production image on the existing GitHub runner
        run: |
          set -euo pipefail
          IMAGE="registry.fly.io/nuni-web:source-${EXPECTED_RELEASE_SHA}"
          docker buildx build --platform linux/amd64 --provenance=false --load -f deploy/web/Dockerfile.nuni -t "$IMAGE" \
            --build-arg CAMPUS_RELEASE_SHA \
            --build-arg NEXT_PUBLIC_SITE_URL \
            --build-arg NEXT_PUBLIC_FUNCTIONS_BASE_URL \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID \
            --build-arg ASSIGNMENT_FILE_SUBMIT_ENABLED .
          docker run -d --name campus-web-release-check --memory 512m -p 127.0.0.1:18080:3000 \
            -e CAMPUS_LEGACY_ENABLED=true "$IMAGE"
          trap 'docker rm -f campus-web-release-check >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --retry 10 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:18080/health/live >/dev/null
          node deploy/web/release-check.mjs smoke http://127.0.0.1:18080
          test "$(docker exec campus-web-release-check id -u)" != '0'
          mkdir -p release-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch('http://127.0.0.1:18080/health/ready', { signal: AbortSignal.timeout(15000) });
          const health = await response.json();
          if (!response.ok || health.status !== 'ready' || health.legacy !== 'ready' || health.revision !== process.env.EXPECTED_RELEASE_SHA) {
            throw new Error('Both Web processes must be ready within the production 512 MB memory limit.');
          }
          fs.writeFileSync('release-evidence/local-health.json', JSON.stringify(health, null, 2));
          NODE
          docker exec -i campus-web-release-check node - < deploy/web/runtime-security-check.cjs \
            | tee release-evidence/runtime-security.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('release-evidence/runtime-security.json', 'utf8'));
          if (report.ok !== true || report.expectedVersion !== '16.4.2') {
            throw new Error('Built image failed current/legacy Next runtime security check.');
          }
          if (
            report.expectedPackages?.next !== '16.4.2' ||
            report.expectedPackages?.sharp !== '0.35.5' ||
            report.expectedPackages?.['source-map-js'] !== '1.2.2'
          ) {
            throw new Error('Built image runtime security expected package pins are incorrect.');
          }
          for (const name of ['current', 'legacy']) {
            const runtime = report.runtimes?.[name];
            if (runtime?.version !== '16.4.2') {
              throw new Error(`Built image ${name} Next runtime is not the approved version.`);
            }
            const nextVersions = (runtime.packages?.next || []).map((item) => item.version);
            const sharpVersions = (runtime.packages?.sharp || []).map((item) => item.version);
            const sourceMapVersions = (runtime.packages?.['source-map-js'] || []).map((item) => item.version);
            if (!nextVersions.length || nextVersions.some((version) => version !== '16.4.2')) {
              throw new Error(`Built image ${name} next pin scan failed: ${JSON.stringify(nextVersions)}`);
            }
            if (!sharpVersions.length || sharpVersions.some((version) => version !== '0.35.5')) {
              throw new Error(`Built image ${name} sharp pin scan failed: ${JSON.stringify(sharpVersions)}`);
            }
            if (sourceMapVersions.some((version) => version !== '1.2.2')) {
              throw new Error(`Built image ${name} source-map-js pin scan failed: ${JSON.stringify(sourceMapVersions)}`);
            }
          }
          NODE
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/campus-web-digests.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/campus-web-digests.json`, 'utf8'));
          const image = entries.find((entry) => /^registry\.fly\.io\/nuni-web@sha256:[a-f0-9]{64}$/.test(entry));
          if (!image) throw new Error('Published image digest could not be established.');
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_IMAGE=${image}\n`);
          fs.writeFileSync('release-evidence/image.json', JSON.stringify({ image, revision: process.env.EXPECTED_RELEASE_SHA }, null, 2));
          NODE
      - name: Recheck source and production before changing any machine
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node deploy/web/release-check.mjs gate
          flyctl machine list --app nuni-web --json > "$RUNNER_TEMP/campus-web-machines-current.json"
          node deploy/web/release-check.mjs snapshot "$RUNNER_TEMP/campus-web-machines-current.json" release-evidence/pre-rollout.json
          rm -f "$RUNNER_TEMP/campus-web-machines-current.json"
          node deploy/web/release-check.mjs stable release-evidence/before.json release-evidence/pre-rollout.json
          node deploy/web/transit-release-gate.mjs fly release-evidence/pre-rollout.json release-evidence/transit-before-rollout.json
      - name: Roll out to existing Web machines only
        id: rollout
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy --app nuni-web --config deploy/web/fly.nuni.toml \
            --image "$RELEASE_IMAGE" --strategy rolling --update-only --ha=false --yes
      - name: Verify both machines and public release
        id: verify
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app nuni-web --json > "$RUNNER_TEMP/campus-web-machines-after.json"
          node deploy/web/release-check.mjs snapshot "$RUNNER_TEMP/campus-web-machines-after.json" release-evidence/after.json
          rm -f "$RUNNER_TEMP/campus-web-machines-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('release-evidence/after.json', 'utf8'));
          if (!rows.every((row) => row.image === process.env.RELEASE_IMAGE)) {
            throw new Error('Not every Web machine has the expected image.');
          }
          // Afterdeploy: same immutable digest that passed runtime-security-check is live.
          const runtime = JSON.parse(fs.readFileSync('release-evidence/runtime-security.json', 'utf8'));
          if (runtime.ok !== true || runtime.expectedVersion !== '16.4.2') {
            throw new Error('Missing successful pre-rollout runtime security evidence for the released image.');
          }
          const image = JSON.parse(fs.readFileSync('release-evidence/image.json', 'utf8'));
          if (image.image !== process.env.RELEASE_IMAGE) {
            throw new Error('Release image digest evidence does not match the rolled-out image.');
          }
          NODE
          node deploy/web/transit-release-gate.mjs fly release-evidence/after.json release-evidence/transit-after-rollout.json
          node deploy/web/release-check.mjs verify
          node deploy/web/transit-release-gate.mjs public
      - name: Restore previous Web image after failed verification
        if: failure() && steps.rollout.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NUNI_WEB_DEPLOY_TOKEN }}
        run: node deploy/web/release-check.mjs rollback release-evidence/before.json
      - name: Preserve sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove local registry credentials and transient machine responses
        if: always()
        run: |
          docker logout registry.fly.io >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP"/campus-web-machines-*.json "$RUNNER_TEMP/campus-web-digests.json"
