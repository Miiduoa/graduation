# Exercises local RAG, not the smaller cloud requirements lock.
# Never mount real user Chroma data; the workflow creates a throwaway fixture.
name: Local Chroma Persistence Compatibility

on:
  pull_request:
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/rag/**'
      - 'backend/ai-server/tests/chroma_migration_smoke.py'
      - '.github/workflows/chroma-local-compat.yml'
  push:
    branches: [main]
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/rag/**'
      - 'backend/ai-server/tests/chroma_migration_smoke.py'
      - '.github/workflows/chroma-local-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-persistent-store:
    name: Migrate isolated Chroma store (NumPy ${{ matrix.numpy-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ['1.26.4', '2.5.4']
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/ai-server
    env:
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install old embedded Chroma dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'chromadb==0.5.23' \
            'langchain-text-splitters==1.1.3' 'python-dotenv>=1.2.2'
          python -m pip check
      - name: Seed a legacy persistent store with known embeddings
        run: python tests/chroma_migration_smoke.py seed "./.chroma-upgrade-fixture"
      - name: Upgrade Chroma with candidate NumPy version
        run: |
          python -m pip install --upgrade 'chromadb==1.5.9' "numpy==${{ matrix.numpy-version }}"
          python -m pip check
      - name: Verify legacy data, query, metadata and source deletion
        run: python tests/chroma_migration_smoke.py verify "./.chroma-upgrade-fixture"
      - name: Verify persistence after restart and reinsertion
        run: python tests/chroma_migration_smoke.py restart "./.chroma-upgrade-fixture"
      - name: Scope notice
        run: |
          echo '::notice::Tests isolated x86_64 persistence only. Apple Silicon MLX/ONNX and real local stores need separate backup-and-restore validation.'
