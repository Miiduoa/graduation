appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# Guest access must not depend on a Google or university login.
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertNotVisible:
    id: tab-Today
- assertVisible:
    id: platform-workspace-start
- takeScreenshot: guest_startup

# Google is the primary entry before school import and the public-service directory.
# Scroll the landing page itself; a nested composer field must not steal the swipe.
# Check the heading before scrolling to its action; they need not share a viewport.
- hideKeyboard
- retry:
    maxRetries: 8
    commands:
      - runFlow:
          when:
            notVisible:
              id: login-google-account
          commands:
            - swipe:
                from:
                  id: login-landing
                direction: UP
                duration: 500
      - assertVisible:
          id: login-google-account
- assertVisible: 'Google 帳號'
# The heading can sit on screen while the action is still under the test-login overlay.
- retry:
    maxRetries: 8
    commands:
      - runFlow:
          when:
            notVisible: '登入或建立帳號|確認 Google 帳號|處理未完成的登出|查看登入問題'
          commands:
            - swipe:
                from:
                  id: login-landing
                direction: UP
                duration: 400
      - assertVisible:
          id: '^login-start$'
          enabled: true
      - assertVisible:
          text: '登入或建立帳號|確認 Google 帳號|處理未完成的登出|查看登入問題'
          enabled: true
# iOS reports the control visible when only its top edge is on screen. The tap
# then aims at a point below the window and never leaves the landing page.
- scrollUntilVisible:
    element:
      id: '^login-start$'
    direction: DOWN
    centerElement: true
    timeout: 20000
# Assert the visible terminal state rather than a non-interactive page container.
# A remote session failure is not a successful login; recovery must remain usable.
# The first iOS tap can report a hierarchy change while still on the landing page.
# Retry this transition only while its source is visible; never tap the next page.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: login-landing
          commands:
            - scrollUntilVisible:
                element:
                  id: '^login-start$'
                direction: DOWN
                centerElement: true
                timeout: 20000
            - assertVisible:
                id: '^login-start$'
                enabled: true
            - waitForAnimationToEnd
            - tapOn:
                id: '^login-start$'
                enabled: true
                retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            text: '登入或建立帳號|目前無法確認登入狀態|登出尚未完成'
          timeout: 20000
      - assertNotVisible:
          id: login-landing
- assertNotVisible: '登出 Google 帳號'
- runFlow:
    when:
      visible: '目前無法確認登入狀態'
    commands:
      - assertVisible:
          text: '重新確認登入狀態'
          enabled: true
      - assertVisible:
          text: '開啟網頁版登入'
          enabled: true
      - assertNotVisible: '申請學校資格'
- runFlow:
    when:
      visible: '登出尚未完成'
    commands:
      - assertVisible:
          text: '重試登出'
          enabled: true
- runFlow:
    when:
      visible: '登入或建立帳號'
    commands:
      - assertVisible:
          text: '使用 Google 繼續|開啟網頁版登入'
          enabled: true
- takeScreenshot: platform_account_state

# On iOS the navigation header owns the back action.
- runFlow: ../helpers/return-to-landing.yaml
# Returning preserves the landing scroll position at the Google account entry.
# The optional school/import section now follows it farther down the page.
- scrollUntilVisible:
    element:
      id: school-picker-open
    direction: DOWN
    centerElement: true
- runFlow: ../helpers/select-nthu.yaml
- scrollUntilVisible:
    element:
      id: school-import-start
    direction: DOWN
    centerElement: true
- assertVisible:
    id: school-import-start
# Never assume an unavailable school provider can authenticate a student.
- runFlow:
    when:
      visible:
        id: school-login-start
    commands:
      - assertNotVisible:
          id: school-login-hint
- runFlow:
    when:
      visible:
        id: school-login-hint
    commands:
      - assertNotVisible:
          id: school-login-start
- takeScreenshot: school_login_availability

# Exercise the real import route and return, not merely the entry label.
# This does not grant guest access to another account's records or run a model.
- tapOn:
    id: school-import-start
- extendedWaitUntil:
    visible: '匯入我的資料'
    timeout: 20000
- assertNotVisible:
    id: login-landing
- takeScreenshot: personal_import_entry
- runFlow: ../helpers/return-to-landing.yaml

# The guest shortcuts are above the account and school import sections.
- scrollUntilVisible:
    element:
      id: public-Map
    direction: UP
    centerElement: true
- assertVisible:
    id: public-Map
