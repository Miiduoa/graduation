name: Campus social feed discovery regression

on:
  push:
    branches:
      - 'feat/social-feed-older-search-20261106'
    paths:
      - 'apps/web/src/app/community/_components/FeedTab*'
      - 'apps/web/src/app/community/_components/feedView*'
      - 'apps/web/src/lib/community/firestore*'
      - 'apps/web/src/lib/community/feedPages*'
      - 'backend/firestore/firestore.rules'
      - '.github/workflows/campus-social-feed-discovery.yml'
  pull_request:
    branches:
      - main
      - 'feat/story-media-in-place-retry-20261106'
    paths:
      - 'apps/web/src/app/community/_components/FeedTab*'
      - 'apps/web/src/app/community/_components/feedView*'
      - 'apps/web/src/lib/community/firestore*'
      - 'apps/web/src/lib/community/feedPages*'
      - 'backend/firestore/firestore.rules'
      - '.github/workflows/campus-social-feed-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-feed-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-feed:
    name: Older-post search and retry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install from lockfile
        id: install
        run: pnpm install --frozen-lockfile
      - name: Feed discovery interaction, model and service tests
        run: pnpm --filter web exec vitest run src/app/community/_components/FeedTab.following.test.tsx src/app/community/_components/feedView.test.ts src/lib/community/firestore.feedRead.test.ts src/lib/community/feedPages.test.ts
      - name: Real SDK and repository rules in an isolated emulator
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          REQUIRE_FEED_EMULATOR: '1'
        run: pnpm exec firebase emulators:exec --project demo-campus-feed-read --only firestore "pnpm --filter web exec vitest run src/lib/community/firestore.feedRead.emulator.test.ts src/lib/community/feedPages.emulator.test.ts"
      - name: Web typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter web typecheck
