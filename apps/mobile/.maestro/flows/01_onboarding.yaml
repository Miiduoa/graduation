appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# Guest access must not depend on a Google or university login.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertVisible:
    id: public-Map
- assertNotVisible:
    id: tab-Today
- takeScreenshot: guest_startup

# The platform account is the path for courses, assignments and merchant work.
- scrollUntilVisible:
    element:
      id: login-start
    direction: DOWN
- assertVisible: 'Google 帳號'
- tapOn:
    id: login-start
- extendedWaitUntil:
    visible: '登入或建立帳號'
    timeout: 20000
- assertVisible: '從你的課程開始'
- takeScreenshot: platform_login

# School authentication is a separate, capability-gated entry.
- back
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
- scrollUntilVisible:
    element:
      id: school-login-start
    direction: DOWN
- assertVisible: '連線學校帳號'
- takeScreenshot: school_login_availability
