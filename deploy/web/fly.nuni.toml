app = "nuni-web"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  CAMPUS_API_ALLOW_CLUSTER_HTTP = "false"
  NEXT_PUBLIC_AUTH_MODE = "campus-account"
  NEXT_PUBLIC_ON_DEVICE_AI_RELEASE = "true"
  CAMPUS_LEGACY_ENABLED = "true"
  NUNI_CLASSROOM_ENABLED = "true"
  NUNI_API_BASE_URL = "https://api.nuni.tw"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
