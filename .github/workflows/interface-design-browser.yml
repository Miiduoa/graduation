name: Interface Design Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/components/AppHeader*'
      - 'apps/web/src/components/CampusServiceMenu*'
      - 'apps/web/src/components/ServiceDirectory*'
      - 'apps/web/src/components/TodayCampusEntry*'
      - 'apps/web/src/components/SchoolSelector*'
      - 'apps/web/src/components/QuickCampusEntry*'
      - 'apps/web/src/components/VoiceDictationButton*'
      - 'apps/web/src/components/PageRecovery*'
      - 'apps/web/src/components/PageLoadingCard*'
      - 'apps/web/src/app/error.tsx'
      - 'apps/web/src/app/not-found.tsx'
      - 'apps/web/src/app/search/**'
      - 'apps/web/src/lib/useCampusFinderAccount*'
      - 'apps/web/src/components/academic/**'
      - 'apps/web/src/components/today/**'
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/app/globals.css'
      - 'apps/web/src/app/home.module.css'
      - 'apps/web/src/lib/campusNavigation*'
      - 'apps/web/src/lib/primaryNavigation*'
      - 'apps/web/src/lib/currentTabNavigation*'
      - 'apps/web/src/lib/menuNavigationReturn*'
      - 'apps/web/src/lib/mobileNavigationInset*'
      - 'apps/web/src/lib/campusServices*'
      - 'scripts/qa/interface-design/**'
      - 'scripts/qa/browser/**'
      - 'apps/web/package.json'
      - 'apps/web/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/interface-design-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-design-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Navigation, motion and feedback on desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and Chinese fonts
        run: |
          python -m pip install playwright==1.57.0
          bash scripts/qa/browser/install-playwright.sh --fonts-noto-cjk
      - name: Bundle real interface with explicit synthetic data boundaries
        run: node scripts/qa/interface-design/build.mjs
      - name: Verify interface, forms and accessibility scenarios
        # Keep the existing interface suite headless. A separate headed browser
        # measures real notification focus changes on this display.
        run: xvfb-run -a -s "-screen 0 1920x1440x24" python scripts/qa/interface-design/check.py
      - name: Upload rendered evidence and source hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interface-design-browser
          path: artifacts/interface-design
          retention-days: 7
