appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# A fresh installation starts signed out. Authenticated navigation needs a separate test account.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertVisible: '登入你的校園帳號'
- assertNotVisible:
    id: tab-Today
- takeScreenshot: guest_startup
- tapOn:
    id: login-start
- extendedWaitUntil:
    visible: '學校登入'
    timeout: 20000
- assertVisible: '登入學校帳號'
- takeScreenshot: school_login
