appId: ${APP_ID}
name: Authenticated announcement search and detail
tags: [smoke, announcements]
---
- runFlow: ../helpers/sign-in-student.yaml
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://announcements
- extendedWaitUntil:
    visible: '公開處室公告的摘要與原文連結。一般帳號即可查看。'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: announcement-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: announcement-search
- inputText: 'Maestro'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Maestro 選課測試公告'
    direction: DOWN
    timeout: 20000
- tapOn: 'Maestro 選課測試公告'
- extendedWaitUntil:
    visible: '公告詳情'
    timeout: 15000
- assertVisible: '本機模擬器選課公告內容。'
- takeScreenshot: announcement_seeded_detail
