# 12_campus_hub_and_social.yaml
# campus://home/community → 校園社群

appId: ${APP_ID}
name: Campus Hub & Social
tags:
  - smoke
  - campus
  - social

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- openLink: campus://home/community

- extendedWaitUntil:
    visible: '校園社群'
    timeout: 20000

- assertVisible:
    text: '動態'

- tapOn:
    text: '看板'

- waitForAnimationToEnd:
    timeout: 1500

- takeScreenshot: campus_social_boards

- back
