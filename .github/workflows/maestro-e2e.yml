name: E2E Tests (Maestro)

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
          - onboarding
          - authentication
          - announcements
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/maestro-e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Maestro E2E Tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: '1'
      APP_ENV: development
      EXPO_PUBLIC_MAESTRO: '1'
      EXPO_PUBLIC_ALLOW_LOCAL_MOCK_AUTH: 'false'
      EXPO_PUBLIC_ENABLE_UNIVERSAL_DEV_ACCOUNTS: 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            device: 'iPhone 15'
          # Android can be added later
          # - platform: android
          #   device: "Pixel_7_API_34"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro Installation
        run: maestro --version

      - name: Setup iOS Simulator
        if: matrix.platform == 'ios'
        env:
          PREFERRED_DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as source:
              available = json.load(source)['devices']
          phones = [device for devices in available.values() for device in devices
                    if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator is installed')
          device = next((item for item in phones if item['name'] == os.environ['PREFERRED_DEVICE']), phones[0])
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_UDID=' + device['udid'] + '\n')
          print('Using simulator:', device['name'], device['udid'])
          PYTHON

      - name: Build iOS Test App
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # The committed native project contains Firebase and llama-rn integration settings.
          # A clean prebuild discards those settings, so install its declared Pods directly.
          pod install --project-directory=ios
          test -d ios/mobile.xcworkspace
          # The CI simulator must run a self-contained JS bundle. A Debug build
          # skips bundling, and a successful Metro /status or curl download does
          # not set the native RCTBundleURLProvider URL on a fresh simulator.
          # The iOS screenshot for #398 showed a redbox even in the first flow.
          # Release builds embed main.jsbundle using the existing Xcode phase;
          # no app functionality or Maestro guest/map assertion is bypassed.
          xcodebuild -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/campus-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$RUNNER_TEMP/campus-ios-build/Build/Products/Release-iphonesimulator/mobile.app"
          test -d "$APP_PATH"
          # Fail before Maestro if the native app still has no bundled JS.
          test -s "$APP_PATH/main.jsbundle"
          echo "Verified embedded iOS JS bundle inside Release simulator app."
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIMULATOR_UDID" "$APP_ID" app

      - name: Run Smoke Tests
        if: github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == ''
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results
          maestro --device "$SIMULATOR_UDID" test .maestro/flows/01_onboarding.yaml \
            --test-output-dir .maestro/screenshots \
            --debug-output .maestro/results/debug \
            --format junit \
            --output .maestro/results/smoke-onboarding.xml \
            --env APP_ID="$APP_ID"
          maestro --device "$SIMULATOR_UDID" test .maestro/flows/05_map.yaml \
            --test-output-dir .maestro/screenshots \
            --debug-output .maestro/results/debug-map \
            --format junit \
            --output .maestro/results/smoke-campus-map.xml \
            --env APP_ID="$APP_ID"

      - name: Run Full Test Suite
        if: github.event.inputs.test_suite == 'full'
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results .maestro/screenshots

          # Run all test flows
          for flow in .maestro/flows/*.yaml; do
            flow_name=$(basename "$flow" .yaml)
            echo "Running: $flow_name"
            
            maestro --device "$SIMULATOR_UDID" test "$flow" \
              --test-output-dir ".maestro/screenshots/$flow_name" \
              --debug-output ".maestro/results/debug/$flow_name" \
              --format junit \
              --output ".maestro/results/${flow_name}-results.xml" \
              --env APP_ID="$APP_ID"
            
            # Small delay between tests
            sleep 5
          done

      - name: Run Specific Test Suite
        if: github.event.inputs.test_suite != 'smoke' && github.event.inputs.test_suite != 'full' && github.event.inputs.test_suite != ''
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results

          # Find and run matching flow
          FLOW_FILE=$(ls .maestro/flows/*_${{ github.event.inputs.test_suite }}.yaml 2>/dev/null | head -1)

          if [ -n "$FLOW_FILE" ]; then
            echo "Running: $FLOW_FILE"
            maestro --device "$SIMULATOR_UDID" test "$FLOW_FILE" \
              --test-output-dir .maestro/screenshots \
              --debug-output .maestro/results/debug \
              --format junit \
              --output .maestro/results/${{ github.event.inputs.test_suite }}-results.xml \
              --env APP_ID="$APP_ID"
          else
            echo "No flow found for: ${{ github.event.inputs.test_suite }}"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          # Shutdown simulator
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results-${{ matrix.platform }}
          path: |
            apps/mobile/.maestro/results/
            apps/mobile/.maestro/screenshots/
          retention-days: 30

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-screenshots-${{ matrix.platform }}
          path: apps/mobile/.maestro/screenshots/
          retention-days: 30

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Test Results (${{ matrix.platform }})
          path: apps/mobile/.maestro/results/*.xml
          reporter: java-junit
          fail-on-error: false

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "E2E tests failed!"
            # Add Slack/Discord/Email notification here
          else
            echo "E2E tests passed!"
          fi
