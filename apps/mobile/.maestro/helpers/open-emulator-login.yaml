appId: ${APP_ID}
---
# Emulator login is compiled only into index.maestro.ts. Production builds never
# mount this control, and a crafted campus:// URI cannot open it.
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertNotVisible:
    id: tab-Today
- hideKeyboard
- runFlow: select-pu.yaml
- tapOn:
    id: maestro-open-emulator-login
    enabled: true
- extendedWaitUntil:
    visible:
      id: maestro-emulator-login
    timeout: 20000
- tapOn:
    id: maestro-email
- inputText: 's0000001@test.campus-one.local'
- tapOn:
    id: maestro-password
