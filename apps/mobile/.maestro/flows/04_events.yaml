# 04_events.yaml

appId: ${APP_ID}
name: Events Flow
tags:
  - smoke
  - events

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible: '快速入口'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 1500

- scrollUntilVisible:
    element:
      id: 'e2e-open-events'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'e2e-open-events'

- extendedWaitUntil:
    visible: '活動'
    timeout: 15000

- takeScreenshot: events_list

- tapOn:
    text: '今日'
    optional: true

- takeScreenshot: events_today

- tapOn:
    text: '本週'
    optional: true

- takeScreenshot: events_this_week

- tapOn:
    text: '本月'
    optional: true

- takeScreenshot: events_this_month

- tapOn:
    text: '全部'
    optional: true

- tapOn:
    index: 0
    below:
      text: '活動'
    optional: true

- extendedWaitUntil:
    visible: '報名'
    timeout: 8000
    optional: true

- takeScreenshot: event_detail

- tapOn:
    text: '設定提醒'
    optional: true

- tapOn:
    text: '報名'
    optional: true

- back
