appId: ${APP_ID}

---
- tapOn:
    id: school-picker-open
- extendedWaitUntil:
    visible:
      id: school-picker-search
    timeout: 15000
# Native input can report completion while the field contains only a prefix.
# Retry only text entry, clearing the previous attempt before checking its echo.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: school-picker-search
          enabled: true
      - waitForAnimationToEnd:
          timeout: 5000
      - eraseText: 4
      - inputText: 'NTHU'
      - assertVisible:
          id: school-picker-search
          text: '^NTHU$'
- extendedWaitUntil:
    visible:
      id: school-picker-option-nthu
    timeout: 20000
- tapOn:
    id: school-picker-option-nthu
# The school change can return the landing scroll view to its top. The
# failed iOS artifact shows NTHU in the hero with the picker below the viewport.
# First require the modal to close, then find the actual selected-campus control.
- extendedWaitUntil:
    notVisible:
      id: school-picker-search
    timeout: 15000
- scrollUntilVisible:
    element:
      id: school-picker-open
      text: '目前瀏覽國立清華大學，選擇其他學校'
    direction: DOWN
    centerElement: false
    timeout: 20000
- assertVisible:
    id: school-picker-open
    text: '目前瀏覽國立清華大學，選擇其他學校'
