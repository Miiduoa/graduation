# 01_onboarding.yaml
# 冷啟動／首次狀態（OnboardingScreen 目前為自動完成的 stub，無多頁引導 UI）
# 執行請用 package.json：`pnpm e2e:maestro:onboarding` 或 `e2e:maestro:onboarding:dev`（傳入 APP_ID）

appId: ${APP_ID}
name: Onboarding Flow
tags:
  - smoke
  - onboarding

---
# 注意：勿在此對 Expo development client 使用 clearState — Maestro 會 reinstall，會清空 JS bundle URL，出現「No script URL provided」（需 Metro：`pnpm dev`）。
# 啟動 App（Metro 需已執行；若先前曾 reinstall，可能需先跑一次 Reload）
- launchApp

- tapOn:
    text: 'Reload'
    optional: true

# 等待進入主 shell（底部 Tab「今天」來自 permissions UNIFIED_TABS）
- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- takeScreenshot: main_screen_after_cold_start

# 驗證底部導覽列（4+1：四 Tab + 中央 AI 球；RN testID tab-<路由名>）
- assertVisible:
    id: 'tab-Today'
- assertVisible:
    id: 'tab-學習'
- assertVisible:
    id: 'tab-校園'
- assertVisible:
    id: 'tab-訊息'
