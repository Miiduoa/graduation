name: Reconcile Functions lockfiles (one-time)
on:
  pull_request:
    paths:
      - 'backend/functions/package.json'
      - 'pnpm-lock.yaml'
      - 'backend/functions/package-lock.json'
      - '.github/workflows/reconcile-functions-locks.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Record the original lockfiles
        run: |
          mkdir -p original-locks/backend/functions
          cp pnpm-lock.yaml original-locks/pnpm-lock.yaml
          cp backend/functions/package-lock.json original-locks/backend/functions/package-lock.json
      - name: Regenerate workspace lock with merged Firebase Admin and Zod 4
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Regenerate independent Functions npm lock
        run: npm install --package-lock-only --ignore-scripts --prefix backend/functions
      - name: Verify both frozen installers
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm ci --prefix backend/functions --ignore-scripts
      - name: Upload exact dependency graphs for review
        uses: actions/upload-artifact@v4
        with:
          name: firebase14-zod4-reconciled-locks
          path: |
            pnpm-lock.yaml
            backend/functions/package-lock.json
            original-locks/
          if-no-files-found: error
          retention-days: 2
