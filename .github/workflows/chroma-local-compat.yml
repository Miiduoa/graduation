# Exercises local RAG, not the smaller cloud requirements lock.
# Never mount real user Chroma data; the workflow creates a throwaway fixture.
name: Local Chroma Persistence Compatibility

on:
  pull_request:
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/rag/**'
      - 'backend/ai-server/tests/chroma_migration_smoke.py'
      - '.github/workflows/chroma-local-compat.yml'
  push:
    branches: [main]
    paths:
      - 'backend/ai-server/requirements.txt'
      - 'backend/ai-server/rag/**'
      - 'backend/ai-server/tests/chroma_migration_smoke.py'
      - '.github/workflows/chroma-local-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-persistent-store:
    name: Migrate isolated Chroma store (NumPy ${{ matrix.numpy-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ['1.26.4', '2.5.4']
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/ai-server
    env:
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install old embedded Chroma in an isolated rollback environment
        run: |
          python -m venv .chroma-legacy-venv
          .chroma-legacy-venv/bin/python -m pip install --upgrade pip
          .chroma-legacy-venv/bin/python -m pip install 'numpy==1.26.4' 'chromadb==0.5.23' \
            'langchain-text-splitters==1.1.3' 'python-dotenv>=1.2.2'
          .chroma-legacy-venv/bin/python -m pip check
      - name: Seed a legacy persistent store with known embeddings
        run: .chroma-legacy-venv/bin/python tests/chroma_migration_smoke.py seed "./.chroma-upgrade-fixture"
      - name: Snapshot the closed legacy fixture before migration
        id: snapshot
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path('.chroma-upgrade-fixture')
          backup = Path('.chroma-upgrade-backup')
          files = list(source.rglob('*'))
          assert not any(path.is_symlink() for path in files), 'fixture contains a symlink'
          expected = {
              path.relative_to(source).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files if path.is_file()
          }
          assert expected, 'legacy fixture is empty'
          assert not backup.exists(), 'backup must be a fresh directory'
          shutil.copytree(source, backup)
          actual = {
              path.relative_to(backup).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in backup.rglob('*') if path.is_file()
          }
          assert actual == expected, 'snapshot does not match the closed fixture'
          Path('.chroma-backup-sha256.json').write_text(json.dumps(expected, sort_keys=True), encoding='utf-8')
          print(f'Closed-fixture snapshot verified: {len(expected)} files')
          PY
      - name: Install candidate Chroma and NumPy without changing the rollback environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'chromadb==1.5.9' "numpy==${{ matrix.numpy-version }}" \
            'langchain-text-splitters==1.1.3' 'python-dotenv>=1.2.2'
          python -m pip check
      - name: Verify legacy data, query, metadata and source deletion
        run: python tests/chroma_migration_smoke.py verify "./.chroma-upgrade-fixture"
      - name: Verify persistence after restart and reinsertion
        run: python tests/chroma_migration_smoke.py restart "./.chroma-upgrade-fixture"
      - name: Restore the unchanged snapshot and verify with the old runtime
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          backup = Path('.chroma-upgrade-backup')
          restored = Path('.chroma-rollback-fixture')
          expected = json.loads(Path('.chroma-backup-sha256.json').read_text(encoding='utf-8'))
          files = list(backup.rglob('*'))
          assert not any(path.is_symlink() for path in files), 'snapshot contains a symlink'
          actual = {
              path.relative_to(backup).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files if path.is_file()
          }
          assert expected and actual == expected, 'snapshot was changed after migration'
          assert not restored.exists(), 'rollback destination must be fresh'
          shutil.copytree(backup, restored)
          restored_hashes = {
              path.relative_to(restored).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in restored.rglob('*') if path.is_file()
          }
          assert restored_hashes == expected, 'restored fixture differs from the snapshot'
          print(f'Rollback copy verified: {len(expected)} files')
          PY
          .chroma-legacy-venv/bin/python -m pip check
          .chroma-legacy-venv/bin/python tests/chroma_migration_smoke.py rollback "./.chroma-rollback-fixture"
      - name: Scope notice
        run: |
          echo '::notice::Tests isolated x86_64 migration and snapshot restoration with the old runtime, not an in-place database downgrade. Apple Silicon MLX/ONNX, real local stores and operational backups still need separate validation.'
