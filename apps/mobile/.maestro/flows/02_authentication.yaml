# 02_authentication.yaml
# AI-First shell：從頭像抽屜進入學號登入或個人資料（無底部「我的」Tab）

appId: ${APP_ID}
name: Authentication Flow
tags:
  - smoke
  - auth

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

# 開啟抽屜
- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- takeScreenshot: drawer_auth_entry

# 個人入口（未登入 → SSOLogin；已登入 → 編輯個人資料）
- tapOn:
    text: '個人資料'

- extendedWaitUntil:
    visible: '編輯個人資料'
    timeout: 6000
    optional: true

- extendedWaitUntil:
    visible: '學號登入'
    timeout: 6000
    optional: true

- takeScreenshot: auth_profile_or_login_screen

# 若為登入表單：輕觸欄位確認 testID（不送出真實登入，避免 E2E 依賴後端）
- tapOn:
    id: 'student-id-input'
    optional: true

- tapOn:
    id: 'student-password-input'
    optional: true

- back
