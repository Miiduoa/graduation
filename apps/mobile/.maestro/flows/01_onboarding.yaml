# 01_onboarding.yaml
# 冷啟動／首次狀態（OnboardingScreen 目前為自動完成的 stub，無多頁引導 UI）
# 執行請用 package.json：`pnpm e2e:maestro:onboarding` 或 `e2e:maestro:onboarding:dev`（傳入 APP_ID）

appId: ${APP_ID}
name: Onboarding Flow
tags:
  - smoke
  - onboarding

---
# 注意：勿在此對 Expo development client 使用 clearState — Maestro 會 reinstall，會清空 JS bundle URL，出現「No script URL provided」（需 Metro：`pnpm dev`）。
# 啟動 App（development client 需先有 Metro：`pnpm dev` / `expo start`，見上方）
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

# iOS 部分版本在連續截視圖／斷言之間需放行動畫，否則 XCTest 會 kAXErrorInvalidUIElement
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      id: 'tab-學習'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'tab-校園'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'tab-訊息'
    timeout: 20000

- takeScreenshot: main_screen_after_cold_start
