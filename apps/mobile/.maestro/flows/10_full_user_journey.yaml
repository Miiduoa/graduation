# 10_full_user_journey.yaml
# Deep link 迴歸路徑（避免依賴儀表捲動與載入時間）

appId: ${APP_ID}
name: Full User Journey
tags:
  - regression
  - journey

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- openLink: campus://home/announcements

- extendedWaitUntil:
    visible:
      id: 'e2e-announcements-screen'
    timeout: 20000

- takeScreenshot: journey_01_announcements

- back

- openLink: campus://home/events

- extendedWaitUntil:
    visible: '活動'
    timeout: 20000
    optional: true

- takeScreenshot: journey_03_events

- back

- openLink: campus://campus/map

- extendedWaitUntil:
    visible: '校園地圖'
    timeout: 20000
    optional: true

- takeScreenshot: journey_05_map

- back

- openLink: campus://campus/cafeteria

- extendedWaitUntil:
    visible: '餐廳'
    timeout: 20000
    optional: true

- takeScreenshot: journey_07_cafeteria

- back

- extendedWaitUntil:
    visible:
      id: 'header-avatar-button'
    timeout: 120000

- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- scrollUntilVisible:
    element:
      text: '一般設定'
    direction: DOWN
    timeout: 20000
    optional: true

- tapOn:
    text: '一般設定'
    optional: true

- takeScreenshot: journey_14_settings_optional

- back
