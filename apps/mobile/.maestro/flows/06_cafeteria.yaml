appId: ${APP_ID}
name: Authenticated cafeteria catalog and filters
tags: [smoke, cafeteria]
---
- runFlow: ../helpers/sign-in-student.yaml
- runFlow:
    file: ../helpers/open-campus-link.yaml
    env:
      CAMPUS_LINK: campus://cafeteria
- extendedWaitUntil:
    visible: '校園餐廳'
    timeout: 20000
- assertVisible: '選店、看菜單，再決定吃什麼。'
- tapOn: '100 元內'
- takeScreenshot: cafeteria_budget_filter
- tapOn: '有菜單'
- tapOn: '全部餐廳'
- tapOn: '餐點或店名'
- inputText: 'maestro-no-match'
- hideKeyboard
- tapOn: '清除搜尋'
- assertVisible: '全部餐廳'
- takeScreenshot: cafeteria_filters_cleared
