# 11_navigation_ai_first.yaml
# 4+1 AI-First：底部四 Tab、頭像抽屜、中央 AI 球
# 需在已通過 Onboarding 的情境下執行（或接在 01 之後）。

appId: ${APP_ID}
name: Navigation AI-First Shell
tags:
  - smoke
  - navigation
  - ai

---

# Development client 需 Metro（`pnpm dev`）；勿搭配會 reinstall 的 clearState，否則失去 bundle URL。
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      id: 'tab-學習'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'tab-校園'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'tab-訊息'
    timeout: 20000

- takeScreenshot: ai_first_tabs

- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- takeScreenshot: header_drawer_open

- tapOn:
    text: '關閉抽屜'
    optional: true

- tapOn:
    id: 'ai-floating-ball'
    optional: true

- waitForAnimationToEnd:
    timeout: 2000
    optional: true

- extendedWaitUntil:
    visible: 'AI 校園助理'
    timeout: 8000
    optional: true

- takeScreenshot: ai_overlay_optional
