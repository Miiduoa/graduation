name: Calendar Workspace Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/components/calendar/**'
      - 'apps/web/src/components/imports/PersonalImport.module.css'
      - 'apps/web/src/app/calendar/**'
      - 'apps/web/src/app/globals.css'
      - 'apps/web/src/app/home.module.css'
      - 'apps/web/src/lib/personalImports*'
      - 'apps/web/src/lib/usePersonalImports*'
      - 'apps/web/src/lib/calendarCourseDeadlines*'
      - 'packages/shared/src/imports/**'
      - 'scripts/qa/calendar-workspace/**'
      - 'scripts/qa/browser/**'
      - 'apps/web/package.json'
      - 'apps/web/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/calendar-workspace-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-workspace-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Calendar day flow on desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and Chinese fonts
        run: |
          python -m pip install playwright==1.57.0
          bash scripts/qa/browser/install-playwright.sh --fonts-noto-cjk
      - name: Bundle real calendar with synthetic source boundaries
        run: node scripts/qa/calendar-workspace/build.mjs
      - name: Verify calendar day flow and responsive layouts
        run: python scripts/qa/calendar-workspace/check.py
      - name: Upload rendered evidence and source hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calendar-workspace-browser
          path: artifacts/calendar-workspace
          retention-days: 7
