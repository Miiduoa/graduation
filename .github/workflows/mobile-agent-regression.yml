name: Mobile Agent Regression

on:
  push:
    branches:
      - 'feat/mobile-ai-*'
    paths:
      - 'apps/mobile/src/**'
      - 'packages/shared/src/assistantExecution.ts'
      - 'packages/shared/src/imports/**'
      - 'backend/functions/agent/assignmentSummary*'
      - 'backend/functions/agent/assignmentPaging*'
      - 'backend/functions/agent/handlers/getCampusAssistantSnapshot.js'
      - '.github/workflows/mobile-agent-regression.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'feat/assistant-sense-and-actions-*'
    paths:
      - 'apps/mobile/src/**'
      - 'packages/shared/src/assistantExecution.ts'
      - 'packages/shared/src/imports/**'
      - 'backend/functions/agent/assignmentSummary*'
      - 'backend/functions/agent/assignmentPaging*'
      - 'backend/functions/agent/handlers/getCampusAssistantSnapshot.js'
      - '.github/workflows/mobile-agent-regression.yml'

permissions:
  contents: read

concurrency:
  group: mobile-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-agent-checks:
    name: Mobile Agent Checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check native app
        run: pnpm --filter mobile typecheck

      - name: Lint native app
        run: pnpm --filter mobile lint

      - name: Check agent scope, evidence and UI regressions
        env:
          TZ: Asia/Taipei
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm --filter mobile exec jest \
            src/__tests__/services/offlineCampusPlanner.test.ts \
            src/__tests__/services/nuniCampusPlanner.test.ts \
            src/__tests__/services/nuniPlanAssignmentTarget.test.ts \
            src/__tests__/services/nuniPlanQuizTarget.test.ts \
            src/__tests__/services/campusPlanComparison.test.ts \
            src/__tests__/services/savedCampusPlans.test.ts \
            src/__tests__/services/campusStudyAgenda.test.ts \
            src/__tests__/services/campusClockAvailability.test.ts \
            src/__tests__/services/campusAssignmentReminders.test.ts \
            src/__tests__/services/campusAssignmentTarget.test.ts \
            src/__tests__/services/campusAssignmentPreview.test.ts \
            src/__tests__/services/campusAssignmentQuery.test.ts \
            src/__tests__/services/campusSenseSnapshot.test.ts \
            src/__tests__/services/campusSensePaging.test.ts \
            src/__tests__/services/campusSenseProgress.test.ts \
            src/__tests__/services/offlineCampusTools.test.ts \
            src/__tests__/services/localCampusToolProtocol.test.ts \
            src/__tests__/features/campusAssistant.test.ts \
            src/__tests__/features/campusAssistantSemantic.test.ts \
            src/__tests__/features/assistantServiceIntegration.test.ts \
            src/__tests__/services/assistantServiceNavigation.test.ts \
            src/__tests__/AssistantServiceReply.test.tsx \
            src/__tests__/assistantCalendarExecution.test.ts \
            src/__tests__/assistantCalendarJournal.test.ts \
            src/__tests__/services/assistantCalendarBatchIntent.test.ts \
            src/__tests__/assistantCalendarBatchStore.test.ts \
            src/__tests__/assistantCalendarBatchExecution.test.ts \
            src/__tests__/AssistantCalendarAction.test.tsx \
            src/__tests__/AssistantCalendarBatchAction.test.tsx \
            src/__tests__/features/campusAssistantCalendarIntegration.test.tsx \
            src/__tests__/features/campusAssistantCalendarRecovery.test.tsx \
            src/__tests__/features/campusAssistantCalendarBatchIntegration.test.tsx \
            src/__tests__/features/nuniCourseworkStudyIntent.test.ts \
            src/__tests__/features/nuniCourseworkStudy.test.ts \
            src/__tests__/features/nuniCourseworkStudyAvailability.test.ts \
            src/__tests__/features/nuniCourseworkStudySuggestions.test.tsx \
            src/__tests__/features/nuniPlanCourseworkStudy.test.ts \
            src/__tests__/features/nuniCourseworkStudyBatch.test.ts \
            src/__tests__/NuniPlanStudyBatchPicker.test.tsx \
            src/__tests__/services/courseworkClockAvailability.test.ts \
            src/__tests__/features/campusAssistantCourseworkStudy.test.ts \
            src/__tests__/features/campusAssistantCourseworkStudyScreen.test.tsx \
            src/__tests__/features/campusAssistantPlanStudyScreen.test.tsx \
            src/__tests__/services/nuniAssignmentReminders.test.ts \
            src/__tests__/services/nuniClassCoursework.test.ts \
            src/__tests__/services/onDeviceSchoolContext.test.ts \
            src/__tests__/services/nextSavedClasses.test.ts \
            src/__tests__/services/savedClassGapQuery.test.ts \
            src/__tests__/NativeLoginLifecycle.test.tsx \
            src/__tests__/nuniSession.test.ts \
            src/__tests__/NuniSessionProvider.test.tsx \
            src/__tests__/nuniDrafts.test.tsx \
            src/__tests__/NuniWorkspaceScreen.test.tsx \
            src/__tests__/NuniTimetableAssistantNavigation.test.tsx \
            src/__tests__/AssistantClassNowHint.test.tsx \
            src/__tests__/SavedClassReplyCard.test.tsx \
            src/__tests__/ClassGapReplyCard.test.tsx \
            src/__tests__/CampusAssistantScreen.test.tsx \
            src/__tests__/CampusEvidencePlanCard.test.tsx \
            src/__tests__/NuniPlanAssignmentOpenButton.test.tsx \
            src/__tests__/NuniPlanQuizOpenButton.test.tsx \
            src/__tests__/SavedCampusPlansPanel.test.tsx \
            src/__tests__/CampusPlanComparisonCard.test.tsx \
            src/__tests__/CampusAssignmentWorkbench.test.tsx \
            src/__tests__/CampusAssignmentCoverage.test.tsx \
            src/__tests__/CampusAssignmentHandoff.test.tsx \
            src/__tests__/CampusStudyAgendaCard.test.tsx \
            src/__tests__/CampusLocalReadResults.test.tsx \
            src/__tests__/AuthSignOut.test.tsx \
            src/__tests__/personalEventReminderNavigation.test.ts \
            src/__tests__/usePushNotifications.test.ts \
            src/__tests__/personalEventReminderTelemetry.test.ts \
            src/__tests__/services/nuniReceiptQuery.test.ts \
            src/__tests__/services/nuniQuizAssistant.test.ts \
            src/__tests__/StudyAgenda.test.tsx \
            src/__tests__/NuniCourses.test.tsx \
            --runInBand --ci

      - name: Check authorized assignment snapshot contract
        run: pnpm --filter functions test --runInBand agent/assignmentSummary.test.js agent/assignmentPaging.test.js agent/executeCampusAssistantCore.sources.test.js
