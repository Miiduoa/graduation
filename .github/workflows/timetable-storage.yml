name: Timetable Storage
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/timetable/**'
      - 'apps/web/src/components/timetable/**'
      - 'apps/web/src/app/timetable/**'
      - '.github/workflows/timetable-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timetable-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-regressions:
    name: Web regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Web lint
        run: pnpm --filter web lint
      - name: Web type check
        run: pnpm --filter web typecheck
      - name: Run all Web tests
        run: pnpm --filter web exec vitest run --reporter=default --reporter=json --outputFile=vitest-storage-results.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-storage-tests
          path: apps/web/vitest-storage-results.json
          if-no-files-found: warn
          retention-days: 7
