# 07_me_features.yaml
# 「我的」已改為隱藏 Tab：由左上角頭像開啟 HeaderDrawer

appId: ${APP_ID}
name: Me Features (Header Drawer)
tags:
  - smoke
  - me

---

- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    id: 'header-avatar-button'

- extendedWaitUntil:
    visible: '個人'
    timeout: 8000

- takeScreenshot: drawer_open

- scrollUntilVisible:
    element:
      text: '我的 QR Code'
    direction: DOWN
    timeout: 20000

- tapOn:
    text: '我的 QR Code'

- extendedWaitUntil:
    visible: 'QR 碼'
    timeout: 8000

- takeScreenshot: qr_code_screen

- back

- tapOn:
    id: 'header-avatar-button'
    optional: true

- tapOn:
    text: '成就與積分'

- extendedWaitUntil:
    visible: '成就與積分'
    timeout: 8000

- takeScreenshot: achievements_screen

- back
