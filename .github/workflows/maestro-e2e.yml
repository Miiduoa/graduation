name: E2E Tests (Maestro)

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
          - onboarding
          - authentication
          - announcements
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/maestro-e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Maestro E2E Tests
    runs-on: macos-latest
    timeout-minutes: 60
    # E2E failures must be reported, even if the independent JS CI passes.
    env:
      CI: '1'
      IOS_BUNDLE_IDENTIFIER: com.campus.app.dev
      APP_ID: com.campus.app.dev

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            device: 'iPhone 15'
          # Android can be added later
          # - platform: android
          #   device: "Pixel_7_API_34"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro Installation
        run: maestro --version

      - name: Setup iOS Simulator
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          SIMULATOR_ID=$(xcrun simctl list devices available | sed -nE 's/.*iPhone 15.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)
          if [ -z "$SIMULATOR_ID" ]; then
            SIMULATOR_ID=$(xcrun simctl list devices available | sed -nE 's/.*iPhone.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)
          fi
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No usable iPhone simulator is available"
            exit 1
          fi
          echo "SIMULATOR_UDID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build and install iOS development client
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme mobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            build
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::xcodebuild produced no simulator .app"
            exit 1
          fi
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIMULATOR_UDID" "$APP_ID" app

      - name: Start Metro and open development client
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo start --ios --dev-client --localhost > /tmp/campus-one-metro.log 2>&1 &
          METRO_PID=$!
          echo "METRO_PID=$METRO_PID" >> "$GITHUB_ENV"
          ready=0
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/campus-one-metro.log
            echo "::error::Metro did not become ready"
            exit 1
          fi

      - name: Run Smoke Tests
        if: github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == ''
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results
          maestro test .maestro/flows/01_onboarding.yaml \
            --format junit \
            --output .maestro/results/smoke-onboarding.xml \
            --env APP_ID="$APP_ID"
          maestro test .maestro/flows/11_navigation_ai_first.yaml \
            --format junit \
            --output .maestro/results/smoke-ai-first.xml \
            --env APP_ID="$APP_ID"

      - name: Run Full Test Suite
        if: github.event.inputs.test_suite == 'full'
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results .maestro/screenshots

          # Run all test flows
          for flow in .maestro/flows/*.yaml; do
            flow_name=$(basename "$flow" .yaml)
            echo "Running: $flow_name"
            
            maestro test "$flow" \
              --format junit \
              --output ".maestro/results/${flow_name}-results.xml" \
              --env APP_ID="$APP_ID"
            
            # Small delay between tests
            sleep 5
          done

      - name: Run Specific Test Suite
        if: github.event.inputs.test_suite != 'smoke' && github.event.inputs.test_suite != 'full' && github.event.inputs.test_suite != ''
        working-directory: apps/mobile
        run: |
          mkdir -p .maestro/results

          # Find and run matching flow
          FLOW_FILE=$(ls .maestro/flows/*_${{ github.event.inputs.test_suite }}.yaml 2>/dev/null | head -1)

          if [ -n "$FLOW_FILE" ]; then
            echo "Running: $FLOW_FILE"
            maestro test "$FLOW_FILE" \
              --format junit \
              --output .maestro/results/${{ github.event.inputs.test_suite }}-results.xml \
              --env APP_ID="$APP_ID"
          else
            echo "No flow found for: ${{ github.event.inputs.test_suite }}"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          # Kill Metro bundler
          if [ -n "${METRO_PID:-}" ]; then
            kill "$METRO_PID" || true
          fi

          # Shutdown simulator
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results-${{ matrix.platform }}
          path: |
            apps/mobile/.maestro/results/
            apps/mobile/.maestro/screenshots/
          retention-days: 30

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-screenshots-${{ matrix.platform }}
          path: apps/mobile/.maestro/screenshots/
          retention-days: 30

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results (${{ matrix.platform }})
          path: apps/mobile/.maestro/results/*.xml
          reporter: java-junit
          fail-on-error: false

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "::error::Scheduled E2E failed or did not complete"
            exit 1
          fi
          echo "Scheduled E2E passed."
