name: Campus feed browser and rules

on:
  push:
    branches: ['feat/social-feed-older-search-20261106']
    paths:
      - 'apps/web/src/app/community/**'
      - 'apps/web/src/lib/community/**'
      - 'backend/firestore/**'
      - 'scripts/qa/social-feed-browser.mjs'
      - '.github/workflows/campus-feed-browser.yml'
  pull_request:
    branches: [main, 'feat/story-media-in-place-retry-20261106']
    paths:
      - 'apps/web/src/app/community/**'
      - 'apps/web/src/lib/community/**'
      - 'backend/firestore/**'
      - 'scripts/qa/social-feed-browser.mjs'
      - '.github/workflows/campus-feed-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-feed-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser to Firestore emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Browser and font prerequisites
        run: |
          command -v google-chrome
          sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update
          sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y fonts-noto-cjk
      - name: Actual feed component and SDK against isolated rules
        env:
          GCLOUD_PROJECT: demo-campus-feed-browser
          TZ: Asia/Taipei
        run: pnpm exec firebase emulators:exec --project demo-campus-feed-browser --only firestore "node scripts/qa/social-feed-browser.mjs"
      - name: Authorization and delayed responses in a clean SDK session
        env:
          GCLOUD_PROJECT: demo-campus-feed-browser
          TZ: Asia/Taipei
          FEED_BROWSER_MODE: authorization
        run: pnpm exec firebase emulators:exec --project demo-campus-feed-browser --only firestore "node scripts/qa/social-feed-browser.mjs"
      - name: Historical list scrolling in a clean SDK session
        env:
          GCLOUD_PROJECT: demo-campus-feed-browser
          TZ: Asia/Taipei
          FEED_BROWSER_MODE: long-list
        run: pnpm exec firebase emulators:exec --project demo-campus-feed-browser --only firestore "node scripts/qa/social-feed-browser.mjs"
      - name: Preserve browser evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-feed-browser-${{ github.run_id }}
          path: artifacts/campus-feed-browser/
          if-no-files-found: warn
          retention-days: 14
