name: Firestore rules check

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'backend/firestore/**'
      - 'backend/storage/**'
      - 'backend/tests/**'
      - 'backend/functions/**'
      - 'apps/mobile/src/services/dmAttachments.ts'
      - 'apps/mobile/src/services/mediaUpload.ts'
      - 'apps/mobile/src/__tests__/services/dmAttachments.test.ts'
      - 'firebase.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rules:
    name: Security rules and transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firestore and Storage rules
        run: pnpm test:rules

      - name: Verify server-side DM media token revocation and authorized delivery
        run: pnpm --filter functions exec jest dmAttachmentDelivery.test.js --runInBand

      - name: Verify mobile DM signed delivery and failure cases
        run: pnpm --filter mobile exec jest src/__tests__/services/dmAttachments.test.ts --runInBand

      - name: Typecheck mobile attachment integration
        run: pnpm --filter mobile typecheck

      - name: Preserve failed emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-rules-failure-logs
          path: |
            firestore-debug.log
            storage-debug.log
          if-no-files-found: ignore
          retention-days: 7
