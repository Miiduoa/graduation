name: Admin Workspace Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/features/admin/**'
      - 'apps/web/src/features/platform/OpsConsole*'
      - 'apps/web/src/features/platform/SchoolReview*'
      - 'apps/web/src/features/platform/ReviewControls*'
      - 'apps/web/src/features/platform/useActiveRequest.ts'
      - 'apps/web/src/features/platform/platformFetch.ts'
      - 'apps/web/src/features/platform/constants.ts'
      - 'apps/web/src/app/admin/**'
      - 'apps/web/src/app/globals.css'
      - 'apps/web/src/components/ui/**'
      - 'scripts/admin-workspace-browser/**'
      - 'scripts/qa/browser/**'
      - '.github/workflows/admin-workspace-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-workspace-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-workflows:
    name: Admin workflows and responsive layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      ADMIN_BROWSER_OUTPUT: artifacts/admin-workspace-browser
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser installer retry behavior
        run: bash scripts/qa/browser/install-playwright.test.sh
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install playwright==1.57.0
          bash scripts/qa/browser/install-playwright.sh --fonts-noto-cjk
      - name: Exercise the management workspace
        run: python scripts/admin-workspace-browser/run.py
      - name: Upload screenshots and interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-workspace-browser
          path: artifacts/admin-workspace-browser
          retention-days: 7
