appId: ${APP_ID}
---
# Real Firebase Auth emulator password authentication. No local mock session or
# role switch is installed. The existing scripts/test-env/seed.cjs owns this
# public, non-production fixture password; the test entrypoint pins loopback.
- runFlow: open-emulator-login.yaml
- tapOn:
    id: maestro-password
- eraseText: 80
- inputText: 'campus-test-1234' # gitleaks:allow public loopback emulator fixture
# Password keyboard on iOS has Return/Go, not a hide-keyboard control. The
# sign-in button sits above the keyboard; tapping it is the real submit.
- tapOn:
    id: maestro-sign-in
    enabled: true
- extendedWaitUntil:
    visible:
      id: tab-Today
    timeout: 90000
- assertNotVisible:
    id: login-landing
- assertNotVisible:
    id: maestro-emulator-login
- extendedWaitUntil:
    visible:
      id: student-today
    timeout: 30000
