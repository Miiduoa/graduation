app = "nuni-functions"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  APP_ENV = "production"
  PORT = "8080"
  HOSTNAME = "0.0.0.0"
  FUNCTIONS_ROOT = "/app"
  ALLOWED_WEB_ORIGINS = "https://nuni.tw,https://www.nuni.tw"
  ENABLE_IN_PROCESS_SCHEDULES = "true"
  # ONLINE_ORDERING_ENABLED is intentionally unset (off).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 80
    soft_limit = 60

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
