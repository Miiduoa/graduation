appId: ${APP_ID}
name: Guest startup and login navigation
tags:
  - smoke
  - onboarding

---
# Guest access must not depend on a Google or university login.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000
- assertNotVisible:
    id: tab-Today
- assertVisible:
    id: platform-workspace-start
- takeScreenshot: guest_startup

# Account and import actions precede the public-service directory.
# Check the heading before scrolling to its action; they need not share a viewport.
# Stop when each target is fully visible, without an extra centering swipe.
- scrollUntilVisible:
    element:
      text: 'Google 帳號'
    direction: DOWN
    centerElement: false
- assertVisible: 'Google 帳號'
- scrollUntilVisible:
    element:
      id: login-start
    direction: DOWN
    centerElement: false
- tapOn:
    id: login-start
# Assert the visible terminal state rather than a non-interactive page container.
# A remote session failure is not a successful login; recovery must remain usable.
- extendedWaitUntil:
    visible:
      text: '登入或建立帳號|目前無法確認登入狀態|登出尚未完成'
    timeout: 20000
- assertNotVisible:
    id: login-landing
- assertNotVisible: '登出 Google 帳號'
- runFlow:
    when:
      visible: '目前無法確認登入狀態'
    commands:
      - assertVisible:
          text: '重新確認登入狀態'
          enabled: true
      - assertVisible:
          text: '開啟網頁版登入'
          enabled: true
      - assertNotVisible: '申請學校資格'
- runFlow:
    when:
      visible: '登出尚未完成'
    commands:
      - assertVisible:
          text: '重試登出'
          enabled: true
- runFlow:
    when:
      visible: '登入或建立帳號'
    commands:
      - assertVisible:
          text: '使用 Google 繼續|開啟網頁版登入'
          enabled: true
- takeScreenshot: platform_account_state

# On iOS the navigation header owns the back action.
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
- scrollUntilVisible:
    element:
      id: school-import-start
    direction: UP
    centerElement: true
- assertVisible:
    id: school-import-start
# Never assume an unavailable school provider can authenticate a student.
- runFlow:
    when:
      visible:
        id: school-login-start
    commands:
      - assertNotVisible:
          id: school-login-hint
- runFlow:
    when:
      visible:
        id: school-login-hint
    commands:
      - assertNotVisible:
          id: school-login-start
- takeScreenshot: school_login_availability

# Exercise the real import route and return, not merely the entry label.
# This does not grant guest access to another account's records or run a model.
- tapOn:
    id: school-import-start
- extendedWaitUntil:
    visible: '匯入我的資料'
    timeout: 20000
- assertNotVisible:
    id: login-landing
- takeScreenshot: personal_import_entry
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000

# Retain the public map entry assertion after bringing it into the viewport.
- scrollUntilVisible:
    element:
      id: public-Map
    direction: DOWN
    centerElement: true
- assertVisible:
    id: public-Map
