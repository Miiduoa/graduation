# 03_announcements.yaml
# 以 deep link 開啟公告總覽（不依賴儀表捲動／Metro 是否已載入新按鈕）

appId: ${APP_ID}
name: Announcements Flow
tags:
  - smoke
  - announcements

---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'tab-Today'
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 2500

- openLink: campus://home/announcements

- extendedWaitUntil:
    visible: '公告'
    timeout: 20000

- takeScreenshot: announcements_list

- tapOn:
    text: '搜尋公告（標題/內文/來源）'

- inputText: '選課'

- extendedWaitUntil:
    visible: '選課'
    timeout: 8000
    optional: true

- takeScreenshot: announcements_search_result

- tapOn:
    index: 1
    optional: true

- extendedWaitUntil:
    visible: '收藏'
    timeout: 8000
    optional: true

- takeScreenshot: announcement_detail_optional

- back
