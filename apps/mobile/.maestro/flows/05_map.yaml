appId: ${APP_ID}
name: Guest campus map access
tags:
  - smoke
  - map
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 90000

# Locate the public entry below the import card before checking visibility.
# Centering also keeps the tap target clear of the development warning banner.
- scrollUntilVisible:
    element:
      id: public-Map
    direction: DOWN
    centerElement: true

- assertVisible:
    id: public-Map

- tapOn:
    id: public-Map

# The landing-page button also says "校園地圖"; require the map-only subtitle.
- extendedWaitUntil:
    visible: '找到校園地點，再安排怎麼過去。'
    timeout: 20000

- assertNotVisible:
    id: login-landing

- takeScreenshot: map_guest_opened

# Both data-backed maps and explicit unavailable states are valid offline.
- extendedWaitUntil:
    visible: '校區位置|尚未提供校園地點|目前無法讀取校園地點'
    timeout: 45000

- takeScreenshot: map_guest_source_state

- tapOn:
    text: '返回'

- extendedWaitUntil:
    visible:
      id: login-landing
    timeout: 20000
